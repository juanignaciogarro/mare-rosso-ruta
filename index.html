<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>huevoruta</title>
<!-- "Agregar a inicio" en Safari: abre sin la barra de direcciones, como una app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="huevoruta">
<meta name="theme-color" content="#F09C53">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F09C53;
    --orange-dark: #D9813A;
    --cream: #FFF2DE;
    --ink: #1E1E1E;
    --ink2: #6B6B6B;
    --ink3: #9A9A9A;
    --border: #1E1E1E;
    --red: #EF4D5A;
    --green: #1DAA61;
    --page-bg: #F5F5F5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    /* iOS Safari a veces se queda con un valor de 100dvh "viejo" (más alto que el viewport
       real) después de minimizar la app, bloquear la pantalla o cambiar de app y volver —
       la barra de Safari a veces no termina de colapsar/expandir en el cálculo de dvh, así
       que la acción de entrega queda empujada fuera de la pantalla hasta el próximo resize
       real (como rotar el teléfono). --app-height la recalcula a mano en esos casos; ver
       setAppHeight() más abajo. 100dvh queda como respaldo si JS todavía no corrió. */
    height: 100%; height: 100dvh; height: var(--app-height, 100dvh);
    background: #fff; color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  #test-banner {
    flex-shrink: 0;
    background: var(--red); color: #fff; text-align: center;
    font-weight: 700; font-size: clamp(12px, 2.3vw, 15px);
    padding: 6px 8px; letter-spacing: 0.3px;
  }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  /* PROTOTIPO: pager de 2 pantallas, deslizable con el dedo (swipe a la derecha desde
     la pantalla principal para llegar a la segunda, swipe a la izquierda para volver). */
  #pager { display: flex; width: 200%; height: 100%; min-height: 0; transform: translateX(-50%); transition: transform 0.3s ease; touch-action: pan-y; }
  #pager.no-anim { transition: none; }
  .pager-page { width: 50%; flex-shrink: 0; height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .dash-page {
    flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px 24px;
    padding-top: max(24px, env(safe-area-inset-top));
  }
  .dash-week-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .dash-week-btn { border: none; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-family: inherit; }
  .dash-week-next svg { transform: scaleX(-1); }
  .dash-week-text { margin-left: 8px; font-size: clamp(18px, 5.25vw, 22px); font-weight: 600; color: var(--ink); white-space: nowrap; }
  .dash-week-year { font-size: 1.3em; font-weight: 300; color: #C9C9C9; }
  .dash-solicitados, .dash-title { font-size: clamp(19px, 5.5vw, 22px); font-weight: 800; color: var(--orange); }
  .dash-solicitados { margin-bottom: 2px; }
  .dash-total { font-size: clamp(38px, 11vw, 52px); font-weight: 500; color: #F0B953; margin-bottom: 20px; }
  .dash-title { margin-bottom: 18px; }
  .dash-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .dash-pill {
    padding: 10px 18px; border-radius: 20px; border: 2px solid var(--ink); background: #fff;
    color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .dash-pill.active { background: var(--orange); border-color: var(--orange); color: #1a1a1a; }
  /* Layout asimétrico tipo "bento": la fila de arriba se reparte en partes iguales, la de
     abajo no (el cartón chico pesa más que la bolsa de café, que queda casi cuadrada). */
  .dash-grid { display: flex; flex-direction: column; gap: 10px; }
  .dash-row { display: flex; gap: 10px; }
  .dash-row-2 .dash-tile:first-child { flex: 1.7; }
  .dash-row-2 .dash-tile:last-child { flex: 1; }
  .dash-tile {
    flex: 1; border-radius: 24px; padding: 16px; min-height: 110px;
    display: flex; align-items: center; justify-content: center; gap: 14px; overflow: hidden;
  }
  .dash-tile.dash-dark { background: var(--orange); }
  .dash-tile.dash-light { background: var(--cream); }
  .dash-tile.dash-gold { background: #E3A23D; }
  .dash-num { font-size: 36px; font-weight: 400; line-height: 1; flex-shrink: 0; }
  .dash-tile.dash-dark .dash-num, .dash-tile.dash-gold .dash-num { color: #fff; }
  .dash-tile.dash-light .dash-num { color: var(--orange); }
  .dash-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dash-refill-banner {
    margin-top: 12px; background: #FDEAEA; border: 2px solid #EF4D5A; border-radius: 16px;
    padding: 12px 16px; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px;
  }
  .dash-refill-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .dash-refill-text { color: #C62F3D; font-weight: 800; font-size: 15px; }
  .dash-refill-boundary { color: #C62F3D; font-size: 11px; font-weight: 600; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dash-refill-btn {
    border: none; background: #EF4D5A; color: #fff; font-weight: 800; font-size: 13px;
    padding: 8px 16px; border-radius: 18px; cursor: pointer; font-family: inherit; flex-shrink: 0;
  }

  /* PROTOTIPO: pestaña para deslizar hacia arriba desde el dashboard y revelar una
     pantalla aparte con un cubo 3D que se puede rotar con el dedo. */
  #page-second { position: relative; }
  .cube-pull-tab {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
    display: flex; align-items: center; justify-content: center; touch-action: none; z-index: 5;
  }
  .cube-pull-tab::before { content: ''; width: 44px; height: 5px; border-radius: 3px; background: var(--ink3); }
  .cube-sheet {
    position: fixed; inset: 0; background: #fff; z-index: 600;
    display: flex; flex-direction: column; transform: translateY(100%);
    transition: transform 0.3s ease; touch-action: none;
  }
  .cube-sheet.no-anim { transition: none; }
  .cube-sheet-handle {
    flex-shrink: 0; height: 34px; display: flex; align-items: center; justify-content: center;
    padding-top: env(safe-area-inset-top); touch-action: none;
  }
  .cube-sheet-handle::before { content: ''; width: 44px; height: 5px; border-radius: 3px; background: var(--ink3); }
  .cube-load-bar {
    position: absolute; top: calc(env(safe-area-inset-top) + 40px); left: 50%; transform: translateX(-50%);
    z-index: 2; display: flex; gap: 10px;
  }
  .cube-load-btn {
    border: none; background: var(--orange); color: #1a1a1a; font-weight: 800; font-size: 14px;
    padding: 10px 20px; border-radius: 20px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .cube-extras-btn { background: var(--cream); }
  .cube-extras-btn:disabled { opacity: 0.4; cursor: default; }
  .cube-scene {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: none;
    padding-top: calc(env(safe-area-inset-top) + 56px); /* despeja el botón "Cargar Dino"/"Extras", que flota encima */
  }
  .cube-scene canvas { touch-action: none; display: block; }
  .crate-info-item { display: flex; flex-direction: row; align-items: center; gap: 6px; }
  .crate-info-qty { font-size: 36px; font-weight: 400; color: var(--ink); line-height: 1; } /* mismo tamaño/peso que .dash-num */
  /* Franja de íconos al pie del 3D: por defecto muestra los extra cartones a bordo por
     SKU; al tocar una caja, esos mismos íconos pasan a mostrar el contenido de esa caja
     y el fondo se tiñe con un tono claro derivado del color de la caja (ver
     crateIconsTint en JS) — así no hace falta una franja aparte arriba del vehículo
     para "achicarle" pantalla al modelo 3D. */
  .crate-icons-panel {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 20px calc(env(safe-area-inset-bottom) + 28px);
    background: #fff; transition: background-color 0.2s ease;
  }
  .crate-icons-title {
    font-weight: 800; font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink);
  }
  .crate-icons-row { display: flex; align-items: center; justify-content: center; gap: 22px; min-height: 60px; }
  .personas-stepper { display: flex; align-items: center; justify-content: center; gap: 28px; margin: 24px 0; }
  .personas-count { font-size: 44px; font-weight: 800; min-width: 54px; text-align: center; }
  .extras-field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .extras-field label { font-weight: 700; font-size: 15px; }
  .extras-field input {
    width: 70px; text-align: center; font-size: 16px; font-weight: 700; font-family: inherit;
    border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #fff;
    border-radius: 10px; padding: 8px;
  }
  .capacidad-excedida-banner {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px);
    z-index: 900; display: none; align-items: center; justify-content: space-between;
    background: #EF4D5A; color: #fff; font-weight: 800; font-size: 15px;
    padding: 16px 18px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .capacidad-excedida-banner.show { display: flex; }
  .capacidad-excedida-banner button { border: none; background: none; color: #fff; font-size: 20px; cursor: pointer; line-height: 1; padding: 0 4px; }
  .sticky-banner {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px);
    z-index: 900; display: none; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--ink); color: #fff; font-weight: 700; font-size: 14px;
    padding: 14px 16px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .sticky-banner.show { display: flex; }
  .sticky-banner button { border: none; background: none; color: #fff; font-size: 20px; cursor: pointer; line-height: 1; padding: 0 4px; flex-shrink: 0; }

  #content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .empty-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .empty-state { text-align: center; color: var(--ink2); padding: 0 20px; font-size: 18px; }

  .hero {
    flex-shrink: 0; background: var(--orange); padding: 18px 16px 55px; border-radius: 0 0 28px 28px;
    padding-top: max(18px, env(safe-area-inset-top));
  }
  .body-pad {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: 40px 16px 20px;
    /* Red de seguridad: en el peor de los casos (pantalla muy chica/angosta, notas muy
       largas) el contenido puede seguir sin entrar incluso truncando direcciones — que se
       pueda scrollear hasta el botón del huevo en vez de quedar inalcanzable es preferible
       a que quede recortado por "overflow:hidden" del <main>. */
    overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
  }
  .body-pad::-webkit-scrollbar { display: none; width: 0; height: 0; }

  .counter-bar { display: flex; align-items: center; gap: 8px; color: #fff; margin-top: 30px; }
  .counter-pill {
    width: 36px; height: 36px; border-radius: 50%; background: none; color: #fff;
    font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center;
    border: 3px solid #fff;
  }
  .counter-pill.dark { background: #fff; color: var(--orange); border: none; }
  .counter-label { font-weight: 400; margin-left: 2px; font-size: 15px; }

  .delivery-card { display: flex; gap: 60px; align-items: flex-end; flex-wrap: wrap; margin-top: 36px; }
  .sku { display: flex; align-items: flex-end; gap: 10px; }
  .sku-qty { font-size: 45px; font-weight: 500; color: #FFEDD5; }
  .sku svg { display: block; }

  .client-block { flex-shrink: 0; }
  .client-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .client-name { font-size: clamp(22px, 5.5vw, 28px); font-weight: 800; line-height: 1.2; }
  /* La nota tiene que leerse completa (no truncarla con "…") — por eso envuelve en vez
     de ir en una sola línea. Si eso hace crecer el bloque más de lo que entra en
     pantalla, .body-pad ya tiene su propia red de seguridad (overflow-y:auto) para
     poder scrollear hasta la action-bar en vez de que quede recortada. */
  .client-row { display: flex; justify-content: flex-start; align-items: flex-start; gap: 18px; margin-top: 8px; min-width: 0; }
  .waze-pin-btn { border: none; background: none; padding: 0; cursor: pointer; flex-shrink: 0; margin-right: 28px; }
  .waze-pin-btn:disabled { opacity: 0.5; }
  .client-zona { color: var(--orange-dark); font-weight: 800; font-size: 15px; white-space: nowrap; flex-shrink: 0; }
  .client-addr { text-align: left; font-size: 15px; min-width: 0; white-space: normal; overflow-wrap: break-word; }
  .addr-link { color: inherit; text-decoration: none; }
  .client-addr .condo { color: var(--ink2); font-weight: 800; }
  .client-addr .casa { color: var(--ink); font-weight: 500; font-size: 20px; margin-left: 4px; }
  .note-pill {
    margin-top: 12px; background: var(--cream); color: var(--ink); padding: 12px 18px;
    border-radius: 999px; font-size: 15px; font-weight: 700; display: flex; gap: 10px; align-items: center;
  }
  .note-pill .warn { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

  .next-block { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .next-rows { flex: 1; min-width: 0; }
  .next-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .next-row .idx {
    width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); color: var(--ink);
    font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .next-row .info { flex: 1; min-width: 0; }
  .next-row .name { font-weight: 800; font-size: 16px; }
  .next-row .addr { color: var(--ink2); font-size: 13px; margin-top: 1px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .next-row.faded:not(.selected) .idx { border-color: #CFCFCF; color: #CFCFCF; }
  .next-row.faded:not(.selected) .name { color: #A3A3A3; }
  .next-row.faded:not(.selected) .addr { color: #C7C7C7; }
  .next-row.selected { background: var(--cream); border-radius: 14px; margin: 0 -12px; padding: 12px; }
  .next-row.selected .idx { border-color: var(--orange-dark); background: var(--orange); color: #1a1a1a; }
  .next-row-note {
    display: flex; align-items: center; gap: 5px; margin-top: 3px;
    color: var(--orange-dark); font-size: 12px; font-weight: 700;
  }
  .next-row-note .warn { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .next-row.faded:not(.selected) .next-row-note { color: #E2BE9D; }
  .next-row .parada-skus { margin-top: 4px; }
  .next-row .parada-sku { background: var(--cream); color: var(--ink2); }
  .next-row .parada-sku.cafe { background: rgba(240,156,83,0.18); color: var(--orange-dark); }
  .next-row.faded:not(.selected) .parada-sku { background: #F2F2F2; color: #C7C7C7; }
  .next-row.faded:not(.selected) .parada-sku.cafe { background: #F2F2F2; color: #D9B99A; }
  /* Botones con assets reales de Figma: el propio SVG trae su círculo/sombra,
     así que el <button> queda sin fondo/borde propio — solo centra el ícono. */
  .chevron-btn, .round-btn, .egg-btn {
    border: none; background: none; padding: 0; display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0; font-family: inherit;
  }
  .action-bar { display: flex; align-items: center; gap: 16px; padding: 10px 2px; flex-shrink: 0; }
  .egg-btn { margin-left: auto; }
  /* Centra el chevron sobre el eje vertical del ícono del huevo (el más ancho de los 3),
     no al ras del borde derecho — si no, al tener menos ancho que el huevo, queda más
     a la derecha que él aunque ambos estén "pegados" al mismo borde. */
  .chevron-btn { margin-right: 30px; }
  .round-btn.dark {
    width: 56px; height: 56px; border-radius: 50%; font-size: 22px; color: #fff;
    border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.18);
  }
  .round-btn.dark.sm { width: 40px; height: 40px; font-size: 16px; }
  .round-btn:disabled, .chevron-btn:disabled, .dash-week-btn:disabled { opacity: 0.35; }
  /* Pequeño "bounce" al estilo Material al tocar un ícono — se agrega la clase por JS
     y se quita sola al terminar, para que pueda volver a dispararse en el próximo tap. */
  @keyframes icon-press-bounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .icon-press-bounce { animation: icon-press-bounce 0.3s ease; }
  .show-all-btn {
    width: 100%; padding: 14px; border-radius: 16px; border: 2px solid var(--ink);
    background: #fff; color: var(--ink); font-weight: 700; font-size: 15px;
    cursor: pointer; font-family: inherit;
  }

  .day-chip {
    padding: 9px 18px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.4);
    background: transparent; color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .day-chip.active { background: var(--orange); color: #1a1a1a; border-color: var(--orange); }

  .overlay-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none;
    align-items: flex-end; justify-content: center; z-index: 500;
  }
  .overlay-backdrop.show { display: flex; }
  #extras-overlay, #personas-overlay { z-index: 700; } /* por encima de .cube-sheet (600), se abren desde ahí */
  /* Interacción táctil — nunca mostrar la barra de scroll, aunque siga siendo desplazable. */
  .overlay-card, .route-list { scrollbar-width: none; -ms-overflow-style: none; }
  .overlay-card::-webkit-scrollbar, .route-list::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .overlay-card {
    background: var(--ink); color: #fff; width: 100%; max-width: 520px; border-radius: 32px 32px 0 0;
    padding: 24px 20px; max-height: 85vh; overflow-y: auto;
  }

  .msg-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .msg-name { font-size: 21px; font-weight: 800; }
  .msg-edit-apodo { background: none; border: none; color: rgba(255,255,255,0.55); font-size: 13px; cursor: pointer; font-family: inherit; }
  .apodo-edit-row { display: flex; gap: 8px; margin-top: 10px; }
  .apodo-edit-row input {
    flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); border-radius: 10px;
    padding: 10px; color: #fff; font-size: 15px; font-family: inherit;
  }
  .msg-bubble { background: #fff; border-radius: 32px; padding: 22px 26px; margin: 18px 0; text-align: center; }
  .msg-textarea {
    width: 100%; background: none; border: none; color: #1a1a1a; font-size: 17px; font-weight: 500;
    resize: vertical; min-height: 70px; font-family: inherit; text-align: center;
  }
  .msg-textarea:focus { outline: none; }
  .send-btn {
    border: none; background: none; padding: 0; cursor: pointer; margin-top: 8px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .msg-alt-row { display: flex; gap: 20px; justify-content: center; align-items: center; margin: 20px 0 6px; }
  .msg-close {
    display: flex; border: none; background: none; padding: 0;
    align-items: center; justify-content: center; cursor: pointer;
  }

  .note-options { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .note-option-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    border: none; background: rgba(255,255,255,0.08); color: #fff; font-family: inherit;
    font-weight: 800; font-size: 16px; padding: 10px 16px; border-radius: 18px; cursor: pointer;
  }
  .note-textarea {
    width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); border-radius: 14px;
    padding: 12px; color: #fff; font-size: 15px; font-family: inherit; resize: vertical; min-height: 90px; margin-top: 12px;
  }
  .note-save-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

// ═══════════════════════════════════════════════
function getWeekDates(offset = 0) {
  const now = new Date();
  const day = now.getDay();
  const adjustedOffset = (day === 0) ? offset + 1 : offset;
  const daysToMonday = (day === 0) ? -6 : 1 - day;
  const mon = new Date(now); mon.setDate(now.getDate() + daysToMonday + adjustedOffset * 7);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const pad = n => String(n).padStart(2, '0');
  const key = `${mon.getFullYear()}-${pad(mon.getMonth() + 1)}-${pad(mon.getDate())}`;
  const opts = { day: '2-digit', month: 'short' };
  return { key, label: `${mon.toLocaleDateString('es-CR', opts)} – ${sun.toLocaleDateString('es-CR', opts)} ${sun.getFullYear()}` };
}

        if (qty) parts.push({ k, qty });

// según cuántas filas de huevos dibuja) — por eso el ícono se renderiza al mismo
// tamaño para todos los formatos, escalado proporcionalmente (nunca estirado).
function skuIcon(prodKey, W) {
  W = W || 125; // 96 + 30% — tamaño por defecto, el de la tarjeta de entrega
  if (prodKey === 'cafe') {
    const cafeW = Math.round(W * 0.4); // la bolsa de café va al 40% del ancho del cartón
    const h = Math.round(cafeW * 270 / 130);
    return `<svg width="${cafeW}" height="${h}" viewBox="0 0 130 270">${CAFE_ICON_MARKUP}</svg>`;
  }
  const h = Math.round(W * 277 / 296);
  return `<svg width="${W}" height="${h}" viewBox="0 0 296 277">${SKU_ICON_MARKUP[prodKey] || ''}</svg>`;
}

function dashRawIcon(markup, vbW, vbH, maxDim) {
  const scale = maxDim / Math.max(vbW, vbH);
  const w = Math.round(vbW * scale), h = Math.round(vbH * scale);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${vbW} ${vbH}">${markup}</svg>`;
}
function dashIconPcp(W) { return dashRawIcon(DASH_PCP_ICON_MARKUP, 179, 110, W); }
function dashIconCafe(W) { return dashRawIcon(DASH_CAFE_ICON_MARKUP, 50, 70, W); }

// Load data

async function loadAll() {
  try {
    const [clientes, pedidos, kv] = await Promise.all([
      sbGet('clientes', 'estado=eq.activo&select=*'),
      sbGet('pedidos', `week_key=eq.${wk.key}&select=*`),
      sbGet('kv_store', 'select=key,value')
    ]);
    CLIENTES = clientes;
    PEDIDOS = pedidos;
    CONFIRMACIONES = {}; RUTA_ORDERS = {}; APODOS = {}; ENTREGA_TS = {};
    kv.forEach(row => {
      if (row.key === 'CONFIRMACIONES') { try { CONFIRMACIONES = JSON.parse(row.value || '{}'); } catch (e) {} }
      if (row.key === 'ruta_orders') { try { RUTA_ORDERS = JSON.parse(row.value || '{}'); } catch (e) {} }
      if (row.key === 'apodos') { try { APODOS = JSON.parse(row.value || '{}'); } catch (e) {} }
      if (row.key === 'entrega_ts') { try { ENTREGA_TS = JSON.parse(row.value || '{}'); } catch (e) {} }
    });
    render();
    if (document.getElementById('route-overlay').classList.contains('show')) renderRouteOverlay();
  } catch (e) {
    console.error(e);
    toast('⚠️ Error de conexión — reintentando…');
  }
}

// ═══════════════════════════════════════════════
// Build stop list for selected day — misma fuente que Hoja de Ruta:
// CLIENTES + CONFIRMACIONES (no depende de que pedidos esté generado)
// ═══════════════════════════════════════════════
function buildStops(dia) {
  let confirmed = CLIENTES.filter(c => {
    if (c.estado !== 'activo' || c.ruta !== dia) return false;
    const conf = getConf(c.id);
    return conf && (conf.estado === 'confirmado' || conf.estado === 'cambio');
  });
  const order = getRutaOrder(dia);
  if (order && order.length) {
    const sorted = [];
    order.forEach(id => { const c = confirmed.find(x => x.id === id); if (c) sorted.push(c); });
    confirmed.forEach(c => { if (!sorted.includes(c)) sorted.push(c); });
    confirmed = sorted;
  }
  return confirmed.map(c => {
    const conf = getConf(c.id);
    const pedido = PEDIDOS.find(p => p.id === c.id);
    const parts = productBreakdown(c, conf);
    return { cliente: c, conf, pedido, parts, entregado: pedido ? !!pedido.entregado : false };
  });
}

// "Entrega rápida" (⚡): José logs these as ALREADY delivered, inventory already
// deducted at creation (distinct autoKey namespace: inv_er_*). We only show them
// for visibilidad/totales exactos — nunca como trabajo pendiente, nunca se vuelven a deducir.
function buildQuickStops(dia) {
  return PEDIDOS.filter(p => p.ruta === dia && p.es_entrega_rapida && !(p.auto_key || '').startsWith('vr_'))
    .map(p => {
      const fmt = Array.isArray(p.fmt) ? p.fmt : [];
      const parts = fmt.map(f => {
        const k = f.u === 15 ? 'pcp' : (p.seg === 'b2b' ? 'gsp' : 'gcp');
        return { k, qty: f.q || 0 };
      }).filter(p => p.qty);
      return { isQuick: true, pedido: p, nombre: p.nombre, zona: p.zona, notas: p.notas, tel: p.tel, parts };
    });
}

function wazeUrl(c) {
  if (c.lat && c.lng) return `https://waze.com/ul?ll=${c.lat},${c.lng}&navigate=yes`;
  const addr = encodeURIComponent((c.zona || '') + (c.notas ? ' ' + c.notas : '') + ', Costa Rica');
  return `https://waze.com/ul?q=${addr}&navigate=yes`;
}
function waUrl(c) {
  const digits = (c.tel || '').replace(/\D/g, '');
  return digits ? `https://wa.me/506${digits}` : null;
}
function callUrl(c) {
  const digits = (c.tel || '').replace(/\D/g, '');
  return digits ? `tel:+506${digits}` : null;
}

// ═══════════════════════════════════════════════
// Entregar / Reversar — replica exacta de toggleEntregado() del CRM:
// 1) marca pedidos.entregado  2) escribe deducción idempotente en kv_store.inventario
// ═══════════════════════════════════════════════
async function pedidoRow(stop, entregado) {
  const c = stop.cliente;
  const p = stop.pedido || {};
  return {
    id: c.id,
    week_key: wk.key,
    week_label: p.week_label || wk.label,
    nombre: c.nombre,
    ruta: c.ruta || '',
    zona: c.zona || '',
    notas: c.notas || '',
    tel: c.tel ? String(c.tel) : '',
    fmt: c.fmt || [],
    seg: c.seg || 'domicilio',
    pago: p.pago || 'pendiente',
    entregado,
    nota_cobro: p.nota_cobro || '',
    agregado_manual: p.agregado_manual || false,
    es_entrega_rapida: p.es_entrega_rapida || false,
    auto_key: p.auto_key || ''
  };
}

async function setEntregado(stop, entregado) {
  const invKey = `ruta_${wk.key}_${stop.cliente.id}`;
  try {
    await sbUpsert('pedidos', await pedidoRow(stop, entregado));

    // Leer inventario fresco justo antes de escribir, para minimizar la ventana de carrera
    const kv = await sbGet('kv_store', 'key=eq.inventario&select=value');
    let inv = [];
    try { inv = JSON.parse((kv[0] && kv[0].value) || '[]'); } catch (e) { inv = []; }

    if (entregado) {
      if (!inv.some(i => i.autoKey === invKey)) {
        const { gsp, gcp, pcp } = deductionFromParts(stop.parts);
        inv.push({
          id: Date.now(),
          fecha: new Date().toISOString().split('T')[0],
          tipo: 'entrega',
          desc: 'Entrega: ' + stop.cliente.nombre,
          notas: 'Auto-registrado en ruta (iPad)',
          gsp: -gsp, gcp: -gcp, pcp: -pcp,
          total: -(gsp + gcp + pcp * 0.5),
          autoKey: invKey
        });
        await sbUpsert('kv_store', { key: 'inventario', value: JSON.stringify(inv) });
      }
    } else {
      const filtered = inv.filter(i => i.autoKey !== invKey);
      if (filtered.length !== inv.length) {
        await sbUpsert('kv_store', { key: 'inventario', value: JSON.stringify(filtered) });
      }
    }

    // Reflejar el cambio en el estado local YA, no esperar al próximo poll de 25s
    const idx = PEDIDOS.findIndex(p => p.id === stop.cliente.id);
    if (idx >= 0) PEDIDOS[idx].entregado = entregado;
    else PEDIDOS.push(await pedidoRow(stop, entregado));

    // Para ordenar "Entregados" por orden real de entrega (mas reciente primero),
    // no por el orden de la ruta.
    const tsKey = `${wk.key}_${stop.cliente.id}`;
    if (entregado) ENTREGA_TS[tsKey] = Date.now();
    else delete ENTREGA_TS[tsKey];
    sbUpsert('kv_store', { key: 'entrega_ts', value: JSON.stringify(ENTREGA_TS) }).catch(e => console.error(e));

    // Si ya se corrió "Cargar Dino" hoy, el cajón tiene que reflejar esta entrega al
    // toque, no recién la próxima vez que se apriete el botón — pero marcar/reversar
    // una entrega NO es un "momento de carga": ninguna caja cambia de lugar ni de
    // mezcla, solo se topa la parte real de lo que ya estaba cargado (ver
    // computeAndStoreLoad/capLoadToReal) contra lo que de verdad sigue pendiente.
    if (CURRENT_LOAD) { await computeAndStoreLoad(); renderLoadColors(CURRENT_LOAD); }

    toast(entregado ? '✓ Marcado como entregado' : '↩ Entrega reversada');
    render();
    if (document.getElementById('route-overlay').classList.contains('show')) renderRouteOverlay();
  } catch (e) {
    console.error(e);
    toast('⚠️ No se pudo guardar — reintentá');
  }
}

// Egg button: compute the next pending stop BEFORE awaiting anything, and open
// Waze synchronously inside the tap handler — once we `await`, it's no longer
// a "user gesture" and Safari/WebKit will block a window.open as a popup.
//
// Waze only moves when confirming the CURRENT delivery (the normal sequential flow).
// If the driver manually selected a different upcoming stop and confirmed that one
// instead, they're still on the way to the current stop — Waze must stay put.
function onConfirmClick(clienteId) {
  const stop = STOPS_BY_ID[clienteId];
  if (!stop) return;
  if (clienteId === currentStopId) {
    const stops = buildStops(selectedDay);
    const nextPending = stops.filter(s => !s.entregado && s.cliente.id !== clienteId)[0] || null;
    if (nextPending) {
      openWaze(nextPending.cliente);
      currentStopId = nextPending.cliente.id;
      activeStopId = nextPending.cliente.id;
    } else {
      currentStopId = null;
      activeStopId = null;
    }
  } else {
    // Parada distinta a la actual, confirmada fuera de orden — no navegar, solo
    // volver la selección a la parada actual (comportamiento por defecto).
    activeStopId = currentStopId;
  }
  setEntregado(stop, true);
}

// PROTOTIPO: pager de 2 pantallas con Pointer Events (mismo patrón que el drag-to-reorder
// de la ruta). 0 = pantalla 2 (placeholder), 1 = pantalla principal (la de siempre).
// No se decide si es un swipe horizontal o un tap/scroll vertical hasta que el dedo se
// mueve más de DIRECTION_LOCK px — así no interfiere con los taps normales (next-row,
// botones, el link de dirección, etc.), que casi no tienen movimiento.
let pagerIndex = 1;
function initPager() {
  const pager = document.getElementById('pager');
  const SWIPE_THRESHOLD = 60;
  const DIRECTION_LOCK = 10;
  let startX = null, startY = null, dx = 0, isSwipe = null;

  pager.addEventListener('pointerdown', e => {
    startX = e.clientX; startY = e.clientY; dx = 0; isSwipe = null;
  });
  pager.addEventListener('pointermove', e => {
    if (startX === null) return;
    const curDx = e.clientX - startX;
    const curDy = e.clientY - startY;
    if (isSwipe === null) {
      if (Math.abs(curDx) > DIRECTION_LOCK || Math.abs(curDy) > DIRECTION_LOCK) {
        isSwipe = Math.abs(curDx) > Math.abs(curDy);
        if (isSwipe) pager.classList.add('no-anim');
      }
    }
    if (isSwipe) {
      dx = curDx;
      // Solo se previsualiza deslizando el pager si hay una pantalla DE ESTE PAGER de
      // ese lado — si no hay nada (lado inexistente), o si del otro lado se va a
      // reabrir la pantalla 3D (un overlay aparte, no una página de este pager), no se
      // mueve nada hasta soltar; dx ya queda guardado para decidir igual al soltar.
      const noPagerPreview = (pagerIndex === 1 && curDx < 0) || (pagerIndex === 0 && curDx > 0) ||
        (pagerIndex === 1 && curDx > 0 && mainReturnTarget === '3d');
      if (noPagerPreview) return;
      e.preventDefault();
      const basePct = -pagerIndex * 50;
      pager.style.transform = `translateX(${basePct + (dx / window.innerWidth) * 50}%)`;
    }
  });
  const endDrag = () => {
    if (isSwipe) {
      pager.classList.remove('no-anim');
      if (pagerIndex === 1 && dx > SWIPE_THRESHOLD) {
        // Si la pantalla principal se dejó cerrando la 3D (ver initCubeSwipeClose),
        // deslizar a la derecha desde acá vuelve a abrirla en vez de ir al dashboard —
        // "la pantalla de la que vino". Por defecto (recién abierta la app, o se llegó
        // acá desde el dashboard) va al dashboard, como siempre.
        if (mainReturnTarget === '3d') openCubeSheet();
        else pagerIndex = 0;
      } else if (pagerIndex === 0 && dx < -SWIPE_THRESHOLD) {
        pagerIndex = 1;
        mainReturnTarget = 'dashboard'; // se llegó a la principal por el camino de siempre, no cerrando la 3D
      }
      pager.style.transform = `translateX(${-pagerIndex * 50}%)`;
    }
    startX = null; isSwipe = null;
  };
  pager.addEventListener('pointerup', endDrag);
  pager.addEventListener('pointercancel', endDrag);
}

// PROTOTIPO: pestaña del dashboard que se arrastra hacia arriba para revelar la
// pantalla del cubo 3D, y el tirador propio de esa pantalla para volver a cerrarla.
let cubeSheetOpen = false;
// Siempre arranca desde el mismo ángulo/zoom al abrir — si no, queda como la dejó el
// último arrastre, aunque se haya cerrado y vuelto a abrir después. Los guardas
// (if cubeSheetOpen/!cubeSheetOpen) evitan resetear la vista si ya estaba en ese estado
// (ej. se arrastró el tirador un poco sin cruzar el umbral y volvió a quedar igual).
function openCubeSheet() {
  if (cubeSheetOpen) return;
  cubeSheetOpen = true;
  document.getElementById('cube-sheet').style.transform = 'translateY(0)';
  resetCubeView();
  renderCrateIconsPanel();
}
function closeCubeSheet() {
  if (!cubeSheetOpen) return;
  cubeSheetOpen = false;
  document.getElementById('cube-sheet').style.transform = 'translateY(100%)';
}
function initCubeSheet() {
  const sheet = document.getElementById('cube-sheet');
  const pullTab = document.getElementById('cube-pull-tab');
  const closeHandle = document.getElementById('cube-sheet-handle');
  const DRAG_THRESHOLD = 70;
  let startY = null, dy = 0, dragging = false;

  function bindDrag(handleEl) {
    handleEl.addEventListener('pointerdown', e => {
      startY = e.clientY; dy = 0; dragging = true;
      sheet.classList.add('no-anim');
      handleEl.setPointerCapture(e.pointerId);
    });
    handleEl.addEventListener('pointermove', e => {
      if (!dragging) return;
      dy = e.clientY - startY;
      const basePct = cubeSheetOpen ? 0 : 100;
      const pct = Math.min(100, Math.max(0, basePct + (dy / window.innerHeight) * 100));
      sheet.style.transform = `translateY(${pct}%)`;
    });
    const endDrag = () => {
      if (!dragging) return;
      dragging = false;
      sheet.classList.remove('no-anim');
      const shouldOpen = cubeSheetOpen ? !(dy > DRAG_THRESHOLD) : dy < -DRAG_THRESHOLD;
      if (shouldOpen) openCubeSheet(); else closeCubeSheet();
    };
    handleEl.addEventListener('pointerup', endDrag);
    handleEl.addEventListener('pointercancel', endDrag);
  }
  bindDrag(pullTab);
  bindDrag(closeHandle);
}

// Deslizar hacia la izquierda arrancando en un lugar donde NO se toca el modelo 3D
// (ver rayHitsModel) cierra esta pantalla y vuelve a la principal — si arrancara sobre
// el modelo, se confundiría con girarlo/tocar una caja, así que ese caso queda afuera
// por completo (el gesto ni se seguiría). Guarda además cuál pantalla se dejó, para que
// deslizar a la derecha desde la principal vuelva acá en vez de ir al dashboard.
let mainReturnTarget = 'dashboard'; // 'dashboard' | '3d' — ver initPager
function initCubeSwipeClose() {
  const sheet = document.getElementById('cube-sheet');
  const SWIPE_THRESHOLD = 70;
  const DIRECTION_LOCK = 10;
  let activePointerId = null, startX = null, startY = null, eligible = false, locked = null;

  sheet.addEventListener('pointerdown', e => {
    if (activePointerId !== null) { eligible = false; return; } // ya hay otro dedo (pinch) — no es un swipe
    activePointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY; locked = null;
    eligible = cubeSheetOpen && !rayHitsModel(e.clientX, e.clientY);
  });
  sheet.addEventListener('pointermove', e => {
    if (e.pointerId !== activePointerId || !eligible) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (locked === null && (Math.abs(dx) > DIRECTION_LOCK || Math.abs(dy) > DIRECTION_LOCK)) {
      locked = Math.abs(dx) > Math.abs(dy);
    }
  });
  const endDrag = e => {
    if (e.pointerId !== activePointerId) return;
    if (eligible && locked) {
      const dx = e.clientX - startX;
      if (dx < -SWIPE_THRESHOLD) {
        closeCubeSheet();
        pagerIndex = 1; // pantalla principal
        document.getElementById('pager').style.transform = `translateX(${-pagerIndex * 50}%)`;
        mainReturnTarget = '3d';
      }
    }
    activePointerId = null; eligible = false; locked = null;
  };
  sheet.addEventListener('pointerup', endDrag);
  sheet.addEventListener('pointercancel', endDrag);
}

// Modelo 3D real (OBJ+MTL exportado de Fusion 360, con las 13 cajas como cuerpos
// nombrados) en vez del cubo de prueba. Misma interacción de arrastrar-para-rotar
// que el prototipo anterior, ahora aplicada al mesh de three.js.
let TRUCK_CRATES = {}; // nombre de cuerpo -> Object3D, llenado una vez carga el modelo
// Caja actualmente tocada en el modelo 3D (o null) — global (no solo del closure de
// initCubeRotate) porque renderCrateIconsPanel() y renderLoadColors() también la leen.
let selectedCrateName = null;
// Piezas decorativas del modelo que, de tan pegadas a una caja, casi no dejan tocarla
// directo — tocar la pieza cuenta como tocar la caja que tapa. "low2_ret (1)" es el
// tronco decorativo que se superpone a la caja del volumen 2 (crate_bed_2).
const CRATE_TAP_PROXIES = { 'low2_ret (1)': 'crate_bed_2' };
const DEFAULT_CUBE_ROT = { x: 0.3, y: Math.PI - 0.6 };
const DEFAULT_CUBE_DIST = 5;
let resetCubeView = () => {}; // se asigna de verdad dentro de initCubeRotate, una vez que existen pivot/camera
// true si ese punto de pantalla toca el modelo 3D (cualquier parte, no solo una caja) —
// se asigna de verdad dentro de initCubeRotate. La usa initCubeSwipeClose para que un
// swipe de cierre nunca se confunda con girar/seleccionar algo del modelo.
let rayHitsModel = () => false;
function initCubeRotate() {
  const container = document.getElementById('cube-scene');

  const scene3d = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);

  scene3d.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(3, 5, 4);
  scene3d.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
  fillLight.position.set(-4, -2, -3);
  scene3d.add(fillLight);

  // El pivot es lo único que gira con el dedo; el modelo adentro lleva una corrección
  // fija de eje (Fusion exporta con Z como "arriba", three.js espera Y como "arriba"),
  // así que no se mezcla con la rotación del usuario.
  const pivot = new THREE.Group();
  let rotX = DEFAULT_CUBE_ROT.x, rotY = DEFAULT_CUBE_ROT.y;
  pivot.rotation.set(rotX, rotY, 0);
  scene3d.add(pivot);

  const mtlLoader = new THREE.MTLLoader();
  mtlLoader.setPath('assets/');
  mtlLoader.load('dino_log.mtl', materials => {
    materials.preload();
    const objLoader = new THREE.OBJLoader();
    objLoader.setMaterials(materials);
    objLoader.setPath('assets/');
    objLoader.load('dino_log.obj', obj => {
      obj.rotation.x = -Math.PI / 2; // Z-up (CAD) -> Y-up (three.js)
      obj.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      obj.position.sub(center);
      // Centrar en el punto medio del bbox deja el centro visual/de rotación más
      // sobre la cabina que sobre la caja de carga — se corrige con un offset fijo,
      // calibrado a ojo, para que quede sobre las cajas en vez de sobre el asiento.
      obj.position.x += 0.136;
      obj.position.y += 0.34;
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      pivot.scale.setScalar(2.4 / maxDim);
      pivot.add(obj);

      // Las 13 cajas, identificadas por el nombre de cuerpo que vino de Fusion
      // (crate_bed_1..10, crate_backseat_left/right, crate_copilot) — expuestas
      // globalmente para que la lógica de carga/descarga pueda referenciarlas por nombre.
      TRUCK_CRATES = {};
      obj.traverse(child => {
        if (child.name && child.name.indexOf('crate_') === 0) TRUCK_CRATES[child.name] = child;
      });
      console.log('TRUCK_CRATES', Object.keys(TRUCK_CRATES));

      // Las 13 cajas (cabina + caja de carga) se pintan y se muestran/ocultan recién
      // cuando "Cargar Dino"/"Extras" calculen qué va en cada una ese día — ninguna
      // caja es fija del vehículo, así que todas arrancan con su apariencia original
      // de Fusion hasta que haya una carga calculada.

      // Arreglo de apariencias del modelo, confirmado tocando cada pieza directo en
      // la escena (no por nombre a ciegas):
      //  1) Las guardabarros de un lado quedaron con la apariencia clara en vez de
      //     la oscura del otro lado — Body2:2 (trasera) y Body4:1 (delantera) pasan
      //     al mismo tono que ya tienen Body3 (trasera) y Body1:7 (delantera).
      //  2) Todo lo que use la apariencia "Paint - Metallic (Silver)" (capó/bonnet,
      //     las 2 puertas, la caja/bed, etc. — detectado por el color real que trae
      //     cada pieza, no adivinado por nombre) pasa a la misma apariencia que ya
      //     tiene el paragolpes trasero ("Steel - Satin"). Las guardabarros quedan
      //     afuera de este paso porque ya se resolvieron en el paso 1.
      const SILVER_PAINT_HEX = 0xd1d1d1;
      const BUMPER_HEX = 0xa0a0a0; // "Steel - Satin", el mismo que ya tiene "bumper"
      const DARK_FENDER_HEX = 0x3f3f3f;

      ['Body2:2', 'Body4:1'].forEach(name => {
        obj.traverse(n => {
          if (n.isMesh && n.name === name && n.material && n.material.color) {
            n.material = n.material.clone();
            n.material.color.setHex(DARK_FENDER_HEX);
          }
        });
      });

      function recolorMatchingSlots(root, matchHex, newHex, excludeNames) {
        root.traverse(n => {
          if (!n.isMesh || !n.material) return;
          if (excludeNames.has(n.name)) return;
          const isArr = Array.isArray(n.material);
          const mats = isArr ? n.material : [n.material];
          let changed = false;
          const next = mats.map(m => {
            if (m.color && m.color.getHex() === matchHex) {
              const c = m.clone();
              c.color.setHex(newHex);
              changed = true;
              return c;
            }
            return m;
          });
          if (changed) n.material = isArr ? next : next[0];
        });
      }
      recolorMatchingSlots(obj, SILVER_PAINT_HEX, BUMPER_HEX, new Set(['Body2:2', 'Body4:1']));
    });
  });

  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  // Arrastrar con 1 dedo rota; con 2 dedos hace zoom (acerca/aleja la cámara) en vez de
  // dejar que el navegador interprete el pellizco como zoom de página — por eso cada
  // evento de puntero se trackea individualmente y se llama preventDefault siempre,
  // así el gesto nunca "se escapa" hacia el resto de la UI.
  const pointers = new Map();
  let dragging = false, lastX = 0, lastY = 0;
  let pinchDist = 0;
  let camDist = DEFAULT_CUBE_DIST;
  let panX = 0, panY = 0; // posición del pivot — permite correr el modelo arriba/abajo/izq/der
  const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const midpoint = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

  resetCubeView = () => {
    rotX = DEFAULT_CUBE_ROT.x; rotY = DEFAULT_CUBE_ROT.y;
    pivot.rotation.set(rotX, rotY, 0);
    camDist = DEFAULT_CUBE_DIST;
    camera.position.z = camDist;
    panX = 0; panY = 0;
    pivot.position.set(0, 0, 0);
  };

  // Con 2 dedos, cuánto mundo representa 1px de pantalla a la distancia actual de
  // la cámara — para que el paneo siga al dedo 1 a 1, sin importar el zoom.
  function panUnitsPerPixel() {
    const rect = container.getBoundingClientRect();
    const h = 2 * camDist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const w = h * camera.aspect;
    return { w: w / rect.width, h: h / rect.height };
  }

  // Un toque corto (sin arrastre, sin pellizco) raycastea contra el modelo para
  // mostrar qué SKU tiene esa caja — se distingue del arrastre/zoom por el movimiento.
  // Tocar la misma caja de nuevo, o cualquier parte en blanco (de la escena 3D o del
  // resto de la pantalla), la deselecciona.
  let downX = 0, downY = 0, gestureHadPinch = false;
  const raycaster = new THREE.Raycaster();

  function selectCrate(name) {
    if (selectedCrateName === name) { deselectCrate(); return; }
    if (selectedCrateName) setCrateHighlight(TRUCK_CRATES[selectedCrateName], false);
    selectedCrateName = name;
    setCrateHighlight(TRUCK_CRATES[name], true);
    renderCrateIconsPanel();
  }
  function deselectCrate() {
    if (!selectedCrateName) return;
    setCrateHighlight(TRUCK_CRATES[selectedCrateName], false);
    selectedCrateName = null;
    renderCrateIconsPanel();
  }

  function handleCrateTap(clientX, clientY) {
    const rect = container.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((clientX - rect.left) / rect.width) * 2 - 1,
      -((clientY - rect.top) / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    // Recorre TODos los impactos del rayo (no solo el más cercano): three.js no
    // descarta objetos invisibles al raycastear (eso solo afecta el render), y las
    // cajas que hoy no se usan (setCrateVisible(false)) siguen ahí, ocupando su lugar
    // fijo — pueden "taparle" el toque a una caja vecina que sí está visible. Por eso
    // cada impacto se valida con obj.visible, y si no sirve se sigue probando el
    // siguiente más lejano en vez de quedarse con el primero que haya.
    const hits = raycaster.intersectObject(pivot, true);
    for (const hit of hits) {
      let obj = hit.object;
      while (obj && obj !== pivot) {
        if (obj.name) {
          if (TRUCK_CRATES[obj.name] === obj && obj.visible) { selectCrate(obj.name); return; }
          // El tronco decorativo ("low2_ret") tapa casi toda la caja del volumen 2 desde
          // el ángulo por defecto — tocarlo cuenta como tocar esa caja en vez de fallar.
          const proxyTarget = CRATE_TAP_PROXIES[obj.name];
          if (proxyTarget && TRUCK_CRATES[proxyTarget] && TRUCK_CRATES[proxyTarget].visible) { selectCrate(proxyTarget); return; }
        }
        obj = obj.parent;
      }
    }
    deselectCrate(); // ninguna caja visible hoy quedó bajo el toque (carrocería, o una caja oculta)
  }
  rayHitsModel = (clientX, clientY) => {
    const rect = container.getBoundingClientRect();
    if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return false;
    const ndc = new THREE.Vector2(
      ((clientX - rect.left) / rect.width) * 2 - 1,
      -((clientY - rect.top) / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    return raycaster.intersectObject(pivot, true).length > 0;
  };
  // Tocar cualquier parte en blanco de la pantalla (fuera de la escena 3D, donde el
  // toque corto ya se maneja arriba) también deselecciona.
  document.getElementById('cube-sheet').addEventListener('click', e => {
    if (!container.contains(e.target)) deselectCrate();
  });

  container.addEventListener('pointerdown', e => {
    container.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      downX = e.clientX; downY = e.clientY; gestureHadPinch = false;
    } else if (pointers.size === 2) {
      dragging = false;
      gestureHadPinch = true;
      const pts = [...pointers.values()];
      pinchDist = dist2(...pts);
      lastMid = midpoint(...pts);
    }
  });
  let lastMid = null;
  container.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const d = dist2(...pts);
      if (pinchDist > 0) {
        camDist = Math.min(12, Math.max(1.5, camDist - (d - pinchDist) * 0.02));
        camera.position.z = camDist;
      }
      pinchDist = d;
      // Panear con el punto medio de los 2 dedos — se mueve junto con el zoom, como
      // en un mapa: acercar/alejar y correr el modelo al mismo tiempo si hace falta.
      const mid = midpoint(...pts);
      if (lastMid) {
        const unit = panUnitsPerPixel();
        panX += (mid.x - lastMid.x) * unit.w;
        panY -= (mid.y - lastMid.y) * unit.h; // pantalla hacia abajo = Y del mundo hacia abajo
        pivot.position.set(panX, panY, 0);
      }
      lastMid = mid;
      return;
    }
    if (!dragging) return;
    const dx = e.clientX - lastX, dyMove = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    rotY += dx * 0.008;
    rotX += dyMove * 0.008;
    pivot.rotation.set(rotX, rotY, 0);
  }, { passive: false });
  const stop = e => {
    const isTap = pointers.size === 1 && !gestureHadPinch && dist2({ x: e.clientX, y: e.clientY }, { x: downX, y: downY }) < 6;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) { pinchDist = 0; lastMid = null; }
    if (pointers.size === 0) dragging = false;
    if (isTap) handleCrateTap(e.clientX, e.clientY);
  };
  container.addEventListener('pointerup', stop);
  container.addEventListener('pointercancel', stop);
  // Pellizco en trackpad / rueda con ctrl en desktop — mismo manejo de zoom por cámara.
  container.addEventListener('wheel', e => {
    e.preventDefault();
    camDist = Math.min(12, Math.max(1.5, camDist + e.deltaY * 0.01));
    camera.position.z = camDist;
  }, { passive: false });

  (function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene3d, camera);
  })();
}

// Colores planos por tipo de SKU para distinguir a simple vista qué lleva cada caja
// (las cajas de Fusion no traen un color por SKU, son todas el mismo naranja de appearance).
const CRATE_SKU_COLORS = { gsp: 0xF09C53, gcp: 0xD9813A, pcp: 0x4F7CA8, mixed: 0xE8C547 };
function setCrateSku(crateName, skuKey) {
  const crate = TRUCK_CRATES[crateName];
  const color = CRATE_SKU_COLORS[skuKey];
  if (!crate || color === undefined) return;
  crate.traverse(n => {
    if (n.material) {
      if (!n.__skuColored) {
        n.material = n.material.clone();
        n.__origColor = n.material.color.clone();
        n.__skuColored = true;
      }
      n.material.color.setHex(color);
    }
  });
}

// Animación de "bounce" al presionar un ícono (ver @keyframes icon-press-bounce) — se
// remueve y re-agrega la clase forzando un reflow, para que funcione aunque se taquee
// el botón varias veces seguidas antes de que termine la animación anterior.
function bouncePress(el) {
  el.classList.remove('icon-press-bounce');
  void el.offsetWidth;
  el.classList.add('icon-press-bounce');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

// Para mensajes que el usuario necesita poder releer con calma (ej. el resultado de
// "Cargar Dino") — se queda en pantalla hasta que lo cierran con la X, a diferencia
// de toast() que se esconde solo.
function stickyBanner(msg) {
  document.getElementById('sticky-banner-text').textContent = msg;
  document.getElementById('sticky-banner').classList.add('show');
}
function closeStickyBanner() { document.getElementById('sticky-banner').classList.remove('show'); }

// ═══════════════════════════════════════════════
// Selection
// ═══════════════════════════════════════════════
function ensureSelection(stops) {
  const pending = stops.filter(s => !s.entregado);
  // "Current" is always whoever is first in the pending order — not just "still pending
  // somewhere". Without this, dragging a different stop to the top of the route overlay
  // left the old first client stuck as "current" until something else (changing day)
  // happened to invalidate it outright.
  const newCurrent = pending.length ? pending[0].cliente.id : null;
  if (newCurrent !== currentStopId) {
    const wasDefaultActive = activeStopId === currentStopId;
    currentStopId = newCurrent;
    if (wasDefaultActive) activeStopId = newCurrent; // a new "current" resets any manual pick back to default
  }
  const activeValid = pending.some(s => s.cliente.id === activeStopId);
  if (!activeValid) activeStopId = currentStopId;
}

// Tapping one of the next stops (or a row in the full route overlay) only changes who
// the action buttons target — the big card keeps showing the current delivery, per spec.
// Tapping the already-selected one again deselects it back to the default (the current stop).
function selectStop(id) {
  activeStopId = (activeStopId === id) ? currentStopId : id;
  closeRouteOverlay();
  render();
}

// Tapping anywhere on the main screen that isn't an interactive element clears the
// manual selection, same as tapping the selected row again.
function handleBackgroundTap(e) {
  if (e.target.closest('button, .next-row, a')) return;
  if (activeStopId !== currentStopId) {
    activeStopId = currentStopId;
    render();
  }
}

function changeDay(d) {
  selectedDay = d;
  currentStopId = null;
  activeStopId = null;
  routeSelectedKey = null;
  render();
  renderRouteOverlay();
}

// Fail-safe: la dirección de cada cliente es tappable y abre Waze directo a ese punto,
// sin depender de que el flujo automático (confirmar → siguiente) dispare la navegación.
// stopPropagation evita que el tap también dispare la selección de la fila que lo contiene.
function addrLink(cliente, innerHtml) {
  return `<a class="addr-link" href="${wazeUrl(cliente)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${innerHtml}</a>`;
}

// En la app instalada desde "Agregar a inicio" (modo standalone), window.open() se bloquea
// en silencio en iOS — un <a> real sí funciona ahí. Por eso cualquier apertura externa que
// no pase por un <a> literal en el HTML (el auto-avance al confirmar, el long-press de
// "próximos", WhatsApp) usa este mismo truco: crear el link y clickearlo de verdad, dentro
// del mismo gesto del usuario.
function openExternal(url) {
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function openWaze(cliente) { openExternal(wazeUrl(cliente)); }

// Guarda la ubicación GPS actual del dispositivo como el pin de Waze de ESE cliente
// (solo el cliente de la entrega actual, no toda la ruta) — mismo campo lat/lng que usa
// el CRM original (ver captureGPS() ahí), pero en un solo tap: sin abrir un formulario,
// se persiste directo a la fila de ese cliente en Supabase.
function setWazePinFromGPS(clienteId) {
  if (!navigator.geolocation) { toast('❌ GPS no disponible'); return; }
  toast('📡 Obteniendo ubicación...');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lat = parseFloat(pos.coords.latitude.toFixed(6));
      const lng = parseFloat(pos.coords.longitude.toFixed(6));
      const c = CLIENTES.find(x => x.id === clienteId);
      if (!c) return;
      try {
        await sbUpsert('clientes', { ...c, lat, lng });
        Object.assign(c, { lat, lng });
        toast('✅ Ubicación de Waze guardada');
        render();
      } catch (e) {
        console.error(e);
        toast('⚠️ No se pudo guardar la ubicación');
      }
    },
    err => toast('❌ ' + (err.message || 'Error de GPS')),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// "Condominio Cerro Real, Casa 74" → nombre del lugar (gris, bold) + unidad final (más
// grande, peso liviano), partiendo por la ÚLTIMA coma. Sin coma, todo queda como "condo".
function addrHTML(notas) {
  if (!notas) return '';
  const idx = notas.lastIndexOf(',');
  if (idx === -1) return `<span class="condo">${notas}</span>`;
  const main = notas.slice(0, idx).trim();
  const unit = notas.slice(idx + 1).trim();
  return `<span class="condo">${main}</span>${unit ? `<span class="casa">${unit}</span>` : ''}`;
}

// ═══════════════════════════════════════════════
// Pantalla 2 (prototipo) — dashboard de "Por entregar"
// ═══════════════════════════════════════════════
const DASH_DAYS = ['lunes', 'martes', 'miercoles', 'pickup'];
const DASH_PILLS = [
  { key: 'total', label: 'Total' }, { key: 'lunes', label: 'Lun' }, { key: 'martes', label: 'Mar' },
  { key: 'miercoles', label: 'Mié' }, { key: 'pickup', label: 'Pickup' }
];
let dashDay = dashDefaultDay();
let dashWeekOffset = 0; // navegación de semana en el dashboard, independiente de la ruta en vivo (siempre semana actual)
// Capacidad del vehículo en "cartones" (cartón grande = 1, chico = 0.5) — 13 cajas x 10
// c/u con 1 persona (130), pero la cabina pierde lugar con 2 o 3 personas a bordo (ver
// cabinCapsForPersonas) — 120 y 110 respectivamente. Se deriva de esa misma función en
// vez de tener un segundo número a mano, para que nunca queden desincronizados.
function vehicleCapacityCartones(personas) {
  const caps = cabinCapsForPersonas(personas);
  const cabinEquiv = equivOf('gcp', caps.copilotCap) + equivOf('pcp', caps.pcpCap);
  return cabinEquiv + 10 * CRATE_CARTONES; // + las 10 cajas de la caja de carga
}
let refillBoundaryClientId = null; // último cliente antes del punto de refill, fijado a mano con "Setear refill"
let dashRenderToken = 0;
const DASH_PEDIDOS_CACHE = {}; // week_key -> pedidos[], para no re-pedir semanas ya vistas

// Mismo cálculo de lunes–domingo que getWeekDates(), pero exponiendo el rango y el año
// por separado para el encabezado (fecha en negro, año en gris, como en el CRM original).
const DASH_MESES_ABR = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function getDashWeekLabel(offset) {
  const now = new Date();
  const day = now.getDay();
  const adjustedOffset = (day === 0) ? offset + 1 : offset;
  const daysToMonday = (day === 0) ? -6 : 1 - day;
  const mon = new Date(now); mon.setDate(now.getDate() + daysToMonday + adjustedOffset * 7);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const fmt = d => `${String(d.getDate()).padStart(2, '0')} ${DASH_MESES_ABR[d.getMonth()]}`;
  return {
    range: `${fmt(mon)} – ${fmt(sun)}`,
    year: `'${String(sun.getFullYear()).slice(-2)}`
  };
}

function shiftDashWeek(delta) {
  if (delta > 0 && dashWeekOffset >= 0) return; // no viajamos al futuro
  dashWeekOffset += delta;
  renderDashboard();
}

async function getDashPedidosForWeek(weekKey) {
  if (weekKey === wk.key) return PEDIDOS; // la semana en vivo ya está cargada en memoria
  if (DASH_PEDIDOS_CACHE[weekKey]) return DASH_PEDIDOS_CACHE[weekKey];
  const rows = await sbGet('pedidos', `week_key=eq.${weekKey}&select=*`);
  DASH_PEDIDOS_CACHE[weekKey] = rows;
  return rows;
}

// Variante de buildStops() parametrizada por semana — no toca PEDIDOS/CONFIRMACIONES
// "en vivo" de la ruta actual, para que navegar el dashboard nunca afecte la ruta de hoy.
function buildDashStopsForWeek(dia, weekKey, pedidosForWeek) {
  const confirmed = CLIENTES.filter(c => {
    if (c.estado !== 'activo' || c.ruta !== dia) return false;
    const conf = CONFIRMACIONES[`${weekKey}_${c.id}`] || null;
    return conf && (conf.estado === 'confirmado' || conf.estado === 'cambio');
  });
  return confirmed.map(c => {
    const conf = CONFIRMACIONES[`${weekKey}_${c.id}`] || null;
    const pedido = pedidosForWeek.find(p => p.id === c.id);
    const parts = productBreakdown(c, conf);
    return { cliente: c, conf, pedido, parts, entregado: pedido ? !!pedido.entregado : false };
  });
}

// Mismo origen de datos que el resto de la app (buildStops) — "ordenado" cuenta las
// paradas CONFIRMADAS de la ruta (entregadas o no); las entregas flash (buildQuickStops)
// quedan afuera a propósito, son ventas espontáneas fuera de lo pedido para la semana,
// no cuentan para "lo que se pidió esta semana".
function computeDashTotals(day, weekKey, pedidosForWeek) {
  const days = day === 'total' ? DASH_DAYS : [day];
  const ordered = { gsp: 0, gcp: 0, pcp: 0, cafe: 0 };
  const delivered = { gsp: 0, gcp: 0, pcp: 0, cafe: 0 };
  days.forEach(d => {
    buildDashStopsForWeek(d, weekKey, pedidosForWeek).forEach(s => {
      const nota = s.conf && s.conf.nota;
      withCafeIfNoted(s.parts, nota).forEach(p => {
        if (ordered[p.k] === undefined) return;
        ordered[p.k] += p.qty;
        if (s.entregado) delivered[p.k] += p.qty;
      });
    });
  });
  const remaining = {};
  ['gsp', 'gcp', 'pcp', 'cafe'].forEach(k => remaining[k] = ordered[k] - delivered[k]);
  // Cartones grandes (con y sin plástico) de a 1, chicos de a 2 — y es lo ORDENADO para
  // la semana, no lo que falta: no baja a medida que se entrega.
  const totalCartones = ordered.gsp + ordered.gcp + ordered.pcp / 2;
  return { remaining, totalCartones };
}

function setDashDay(day) { dashDay = day; renderDashboard(); }

async function renderDashboard() {
  const pillsEl = document.getElementById('dash-pills');
  if (!pillsEl) return; // la pantalla 2 todavía no está en el DOM
  const myToken = ++dashRenderToken;

  const weekKey = getWeekDates(dashWeekOffset).key;
  const { range, year } = getDashWeekLabel(dashWeekOffset);
  document.getElementById('dash-week-range').textContent = range;
  document.getElementById('dash-week-year').textContent = year;
  document.getElementById('dash-week-prev').innerHTML = iconChevron(52);
  document.getElementById('dash-week-next').innerHTML = iconChevron(52);
  document.getElementById('dash-week-next').disabled = (dashWeekOffset >= 0);

  let pedidosForWeek;
  try { pedidosForWeek = await getDashPedidosForWeek(weekKey); }
  catch (e) { console.error(e); pedidosForWeek = []; }
  if (myToken !== dashRenderToken) return; // se adelantó otro cambio de semana/día mientras esperábamos

  const { remaining, totalCartones } = computeDashTotals(dashDay, weekKey, pedidosForWeek);

  pillsEl.innerHTML = DASH_PILLS.map(p =>
    `<button class="dash-pill ${p.key === dashDay ? 'active' : ''}" onclick="setDashDay('${p.key}')">${p.label}</button>`
  ).join('');

  const totalFmt = Number.isInteger(totalCartones) ? totalCartones : totalCartones.toFixed(1);
  document.getElementById('dash-total').textContent = `${totalFmt} cartones`;

  document.getElementById('dash-grid').innerHTML = `
    <div class="dash-row dash-row-1">
      <div class="dash-tile dash-dark"><div class="dash-num">${remaining.gsp}</div><div class="dash-icon">${skuIcon('gsp', 72)}</div></div>
      <div class="dash-tile dash-light"><div class="dash-num">${remaining.gcp}</div><div class="dash-icon">${skuIcon('gcp', 72)}</div></div>
    </div>
    <div class="dash-row dash-row-2">
      <div class="dash-tile dash-light"><div class="dash-num">${remaining.pcp}</div><div class="dash-icon">${dashIconPcp(72)}</div></div>
      <div class="dash-tile dash-gold"><div class="dash-num">${remaining.cafe}</div><div class="dash-icon">${dashIconCafe(55)}</div></div>
    </div>
  `;

  // "Refill" es independiente de qué semana/día se esté mirando en el dashboard —
  // es una alerta operativa sobre el día real de hoy, usando los datos en vivo
  // (comparte el mismo TEST_CARGA_WEEK_OFFSET que "Cargar Dino" para poder probar
  // ambos contra la misma semana de prueba cuando haga falta). Compara lo que FALTA
  // entregar hoy (no lo pedido en total — eso no baja con las entregas) contra la
  // capacidad del vehículo, que a su vez depende de cuánta gente hay a bordo.
  const banner = document.getElementById('dash-refill-banner');
  if (banner) {
    const refillWeekKey = TEST_CARGA_WEEK_OFFSET === null ? wk.key : getWeekDates(TEST_CARGA_WEEK_OFFSET).key;
    const refillPedidos = TEST_CARGA_WEEK_OFFSET === null ? PEDIDOS : await getDashPedidosForWeek(refillWeekKey);
    const { remaining } = computeDashTotals(todayDefaultDay(), refillWeekKey, refillPedidos);
    const todayRemaining = remaining.gsp + remaining.gcp + remaining.pcp / 2;
    const needsRefill = todayRemaining > vehicleCapacityCartones(PERSONAS_EN_RUTA);
    banner.style.display = needsRefill ? 'flex' : 'none';
    const boundaryEl = document.getElementById('dash-refill-boundary');
    if (needsRefill && boundaryEl) {
      const boundaryClient = CLIENTES.find(c => c.id === refillBoundaryClientId);
      boundaryEl.textContent = boundaryClient
        ? `Último antes del refill: ${boundaryClient.nombre}`
        : 'Todavía no se fijó el punto de refill.';
    }
  }
}

// "Setear refill" — el repartidor elige, de la lista de paradas de hoy en su orden
// actual (confirmado), cuál es la última entrega antes de volver a cargar el camión.
async function openRefillPicker() {

      <div class="idx">${i + 1}</div>

    </div>`).join('');

function closeRefillPicker() { document.getElementById('refill-picker-overlay').classList.remove('show'); }
function setRefillBoundary(clienteId) {

  closeRefillPicker();
  const c = CLIENTES.find(x => x.id === clienteId);
  toast(`Punto de refill: ${c ? c.nombre : clienteId}`);
