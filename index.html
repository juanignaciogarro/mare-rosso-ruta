<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
  :root {
    --orange: #F09C53;
    --orange-dark: #D9813A;
    --cream: #FFF2DE;
    --ink: #1E1E1E;
    --ink2: #6B6B6B;
    --ink3: #9A9A9A;
    --border: #1E1E1E;
    --red: #EF4D5A;
    --green: #1DAA61;
    --page-bg: #F5F5F5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; height: 100dvh;
    background: #fff; color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  #test-banner {
    flex-shrink: 0;
    background: var(--red); color: #fff; text-align: center;
    font-weight: 700; font-size: clamp(12px, 2.3vw, 15px);
    padding: 6px 8px; letter-spacing: 0.3px;
  }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .empty-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .empty-state { text-align: center; color: var(--ink2); padding: 0 20px; font-size: 18px; }

  .hero {
    flex-shrink: 0; background: var(--orange); padding: 18px 16px 55px; border-radius: 0 0 28px 28px;
    padding-top: max(18px, env(safe-area-inset-top));
  }
  .body-pad {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: 40px 16px 20px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }

  .counter-bar { display: flex; align-items: center; gap: 8px; color: #fff; }
  .counter-pill {
    width: 36px; height: 36px; border-radius: 50%; background: none; color: #fff;
    font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center;
    border: 3px solid #fff;
  }
  .counter-pill.dark { background: #fff; color: var(--orange); border: none; }
  .counter-label { font-weight: 400; margin-left: 2px; font-variant: small-caps; }

  .delivery-card { display: flex; gap: 60px; align-items: flex-end; flex-wrap: wrap; margin-top: 36px; }
  .sku { display: flex; align-items: flex-end; gap: 10px; }
  .sku-qty { font-size: 45px; font-weight: 500; color: #FFEDD5; }
  .sku svg { display: block; }

  .client-block { flex-shrink: 0; }
  .client-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .client-name { font-size: clamp(22px, 5.5vw, 28px); font-weight: 800; line-height: 1.2; }
  .client-row { display: flex; justify-content: flex-start; align-items: baseline; gap: 18px; margin-top: 8px; flex-wrap: wrap; }
  .waze-pin-btn { border: none; background: none; padding: 0; cursor: pointer; flex-shrink: 0; }
  .waze-pin-btn:disabled { opacity: 0.5; }
  .client-zona { color: var(--orange-dark); font-weight: 800; font-size: 15px; white-space: nowrap; }
  .client-addr { text-align: left; font-size: 15px; }
  .addr-link { color: inherit; text-decoration: none; }
  .client-addr .condo { color: var(--ink2); font-weight: 800; }
  .client-addr .casa { color: var(--ink); font-weight: 500; font-size: 20px; margin-left: 4px; }
  .note-pill {
    margin-top: 12px; background: var(--cream); color: var(--ink); padding: 12px 18px;
    border-radius: 999px; font-size: 15px; font-weight: 700; display: flex; gap: 10px; align-items: center;
  }
  .note-pill .warn { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

  .next-block { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .next-rows { flex: 1; min-width: 0; }
  .next-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .next-row .idx {
    width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); color: var(--ink);
    font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .next-row .info { flex: 1; min-width: 0; }
  .next-row .name { font-weight: 800; font-size: 16px; }
  .next-row .addr { color: var(--ink2); font-size: 13px; margin-top: 1px; }
  .next-row.faded:not(.selected) .idx { border-color: #CFCFCF; color: #CFCFCF; }
  .next-row.faded:not(.selected) .name { color: #A3A3A3; }
  .next-row.faded:not(.selected) .addr { color: #C7C7C7; }
  .next-row.selected { background: var(--cream); border-radius: 14px; margin: 0 -12px; padding: 12px; }
  .next-row.selected .idx { border-color: var(--orange-dark); background: var(--orange); color: #1a1a1a; }
  /* Botones con assets reales de Figma: el propio SVG trae su círculo/sombra,
     así que el <button> queda sin fondo/borde propio — solo centra el ícono. */
  .chevron-btn, .round-btn, .egg-btn {
    border: none; background: none; padding: 0; display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0; font-family: inherit;
  }
  .action-bar { display: flex; align-items: center; gap: 16px; padding: 10px 2px; flex-shrink: 0; }
  .egg-btn { margin-left: auto; }
  .round-btn.dark {
    width: 56px; height: 56px; border-radius: 50%; font-size: 22px; color: #fff;
    border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.18);

  .round-btn.dark.sm { width: 40px; height: 40px; font-size: 16px; }
  .round-btn:disabled, .chevron-btn:disabled { opacity: 0.35; }
  .show-all-btn {
    width: 100%; padding: 14px; border-radius: 16px; border: 2px solid var(--ink);
    background: #fff; color: var(--ink); font-weight: 700; font-size: 15px;
    cursor: pointer; font-family: inherit;
  }

  .day-chip {
    padding: 9px 18px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.4);
    background: transparent; color: #fff; font-size: 14px; font-weight: 700;

  /* Interacción táctil — nunca mostrar la barra de scroll, aunque siga siendo desplazable. */
  .overlay-card, .route-list { scrollbar-width: none; -ms-overflow-style: none; }
  .overlay-card::-webkit-scrollbar, .route-list::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .overlay-card {
    background: var(--ink); color: #fff; width: 100%; max-width: 520px; border-radius: 32px 32px 0 0;
    padding: 24px 20px; max-height: 85vh; overflow-y: auto;

  .apodo-edit-row { display: flex; gap: 8px; margin-top: 10px; }
  .apodo-edit-row input {

    padding: 10px; color: #fff; font-size: 15px; font-family: inherit;

  .msg-bubble { background: #fff; border-radius: 32px; padding: 22px 26px; margin: 18px 0; text-align: center; }
  .msg-textarea {
    width: 100%; background: none; border: none; color: #1a1a1a; font-size: 17px; font-weight: 500;
    resize: vertical; min-height: 70px; font-family: inherit; text-align: center;
  }
  .msg-textarea:focus { outline: none; }
  .send-btn {
    border: none; background: none; padding: 0; cursor: pointer; margin-top: 8px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .msg-alt-row { display: flex; gap: 20px; justify-content: center; align-items: center; margin: 20px 0 6px; }
  .msg-close {
    display: flex; border: none; background: none; padding: 0;
    align-items: center; justify-content: center; cursor: pointer;
  }

  /* En el overlay de ruta, header y filtro quedan fijos — solo la lista hace scroll. */
  #route-overlay .overlay-card { display: flex; flex-direction: column; overflow: hidden; }
  .route-header { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .route-pills { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  .route-list { margin-top: 16px; min-height: 0; flex: 1; overflow-y: auto; }
  .parada-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .parada-row + .parada-row { border-top: 1px solid rgba(255,255,255,0.12); }
  .parada-row .idx {
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; color: #fff;
    font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .parada-row .info { flex: 1; min-width: 0; cursor: pointer; }
  .parada-row .name { font-weight: 800; font-size: 16px; }

  .parada-skus { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .parada-sku {
    display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.85); font-size: 11px; font-weight: 700; padding: 3px 9px;
    border-radius: 999px; white-space: nowrap;

  .parada-sku b { color: var(--orange); font-weight: 800; }
  .parada-sku.cafe { background: rgba(240,156,83,0.28); color: var(--orange); }
  .parada-note {
    display: flex; align-items: center; gap: 6px; margin-top: 6px;
    color: var(--orange); font-size: 12px; font-weight: 700;
  }
  .parada-note .warn { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

  .filter-switch { display: flex; background: rgba(255,255,255,0.12); border-radius: 22px; padding: 4px; margin-top: 18px; flex-shrink: 0; }

    flex: 1; border: none; background: none; color: rgba(255,255,255,0.7); padding: 11px;

  .flash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .flash-title { font-size: 19px; font-weight: 800; }
  .flash-field { margin-bottom: 14px; }
  .flash-field > label { display: block; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
  .flash-input {
    width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;

  .flash-input::placeholder { color: rgba(255,255,255,0.35); }

  .flash-search-row {

  .flash-search-row .zona { color: rgba(255,255,255,0.5); font-size: 12px; white-space: nowrap; }
  .flash-row { display: flex; gap: 14px; align-items: center; }
  .flash-qty { max-width: 64px; text-align: center; flex-shrink: 0; padding: 12px 8px; }
  .flash-toggle { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
  .flash-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .flash-toggle-slider {
    display: inline-block; position: relative; width: 48px; height: 28px; border-radius: 14px; flex-shrink: 0;
    background: rgba(255,255,255,0.25); transition: background 0.15s;
  }
  .flash-toggle-slider::before {
    content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; transition: transform 0.15s;
  }
  .flash-toggle input:checked + .flash-toggle-slider { background: var(--orange); }
  .flash-toggle input:checked + .flash-toggle-slider::before { transform: translateX(20px); }
  .flash-toggle-label { font-weight: 700; font-size: 15px; }
  .flash-checkbox-row {
    display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600;

  }
  .flash-checkbox-row input { width: 20px; height: 20px; flex-shrink: 0; }
  .flash-save-btn {
    width: 100%; padding: 16px; border-radius: 16px; border: none;
    background: var(--orange); color: #1a1a1a; font-weight: 800; font-size: 16px;
    cursor: pointer; font-family: inherit;
  }

  #toast {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    background: var(--ink); border: none; color: #fff;
    padding: 10px 18px; border-radius: 12px; font-size: 14px; opacity: 0;
    transition: opacity 0.2s; pointer-events: none; z-index: 999;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="test-banner"></div>

<main onclick="handleBackgroundTap(event)">
  <div id="content"><div class="empty-state">Cargando…</div></div>
</main>

<div id="message-overlay" class="overlay-backdrop" onclick="if(event.target===this) closeMessageOverlay()">

</div>

<div id="route-overlay" class="overlay-backdrop" onclick="if(event.target===this) closeRouteOverlay()">
  <div class="overlay-card">
    <div class="route-header">
      <div class="route-pills" id="route-pills"></div>
      <button class="round-btn dark sm" title="Actualizar" onclick="loadAll()">⟳</button>

<div id="flash-overlay" class="overlay-backdrop" onclick="if(event.target===this) closeFlashOverlay()">
  <div class="overlay-card">
    <div class="flash-header">
      <div class="flash-title">⚡ Entrega flash</div>
      <button class="round-btn dark sm" title="Cerrar" onclick="closeFlashOverlay()">✕</button>
    </div>
    <div class="flash-field">
      <label>Nombre</label>
      <input id="flash-nombre" class="flash-input" placeholder="Nombre del cliente" autocomplete="off" oninput="renderFlashClienteSearch(this.value)">
      <div id="flash-cli-results" class="flash-search-results"></div>
    </div>
    <div class="flash-field">
      <label>Teléfono (opcional)</label>
      <input id="flash-tel" class="flash-input" type="tel" placeholder="8888 8888">
    </div>
    <div class="flash-field">
      <label>Zona</label>
      <input id="flash-zona" class="flash-input" placeholder="Zona">
    </div>
    <div class="flash-field">
      <label>Dirección / nota</label>
      <input id="flash-notas" class="flash-input" placeholder="Condominio, casa, portón…">
    </div>
    <div class="flash-field">
      <label>Cartón grande</label>
      <div class="flash-row">
        <input id="flash-q30" class="flash-input flash-qty" type="number" inputmode="numeric" min="0" value="1">
        <label class="flash-toggle">
          <input id="flash-t30-toggle" type="checkbox" checked onchange="onFlashT30Toggle(this.checked)">
          <span class="flash-toggle-slider"></span>
          <span id="flash-t30-label" class="flash-toggle-label">Con plástico</span>
        </label>
      </div>
    </div>
    <div class="flash-field">
      <label>Cartón pequeño (P-CP)</label>
      <div class="flash-row">
        <input id="flash-q15" class="flash-input flash-qty" type="number" inputmode="numeric" min="0" value="0">
      </div>
    </div>
    <label class="flash-checkbox-row">
      <input id="flash-add-crm" type="checkbox">
      Agregar como cliente permanente
    </label>
    <button class="flash-save-btn" onclick="saveFlashDelivery()">Registrar entrega</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// CONFIG — TEST vs LIVE. Only ever point at LIVE deliberately,
// after everything below has been validated against fake data.
// ═══════════════════════════════════════════════
const CONFIG = {
  MODE: 'LIVE', // 'TEST' | 'LIVE'
  TEST: {
    SUPA_URL: 'https://sgpfpnqzyfazykwnxkue.supabase.co',
    SUPA_KEY: 'sb_publishable_YgSoIQNE9NFrlgYrLYkqZw_HMfpQ1Ng'
  },
  LIVE: {
    SUPA_URL: 'https://dlrfcibanmxipvhucnao.supabase.co',
    SUPA_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscmZjaWJhbm14aXB2aHVjbmFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTI4ODAsImV4cCI6MjA5NTI4ODg4MH0.oRuRJ5_z8mSHBa_be5KQYKr7A5PywRYXHwo3SqSVRug'
  }
};
const SUPA_URL = CONFIG[CONFIG.MODE].SUPA_URL;
const SUPA_KEY = CONFIG[CONFIG.MODE].SUPA_KEY;

document.getElementById('test-banner').style.display = CONFIG.MODE === 'TEST' ? 'block' : 'none';
document.getElementById('test-banner').textContent = '🧪 MODO PRUEBA — datos ficticios, no toca producción';

// ═══════════════════════════════════════════════
// Supabase REST helpers (same pattern as el CRM original)
// ═══════════════════════════════════════════════
async function sbGet(table, params = '') {
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, {
    headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function sbUpsert(table, data) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify(Array.isArray(data) ? data : [data])
  });
  if (!res.ok) throw new Error(await res.text());
}

// ═══════════════════════════════════════════════
// Week key — idéntico a getWeekDates(0) del CRM original
// (lunes = inicio de semana; domingo cuenta como la semana siguiente)
// ═══════════════════════════════════════════════
function getWeekDates(offset = 0) {
  const now = new Date();
  const day = now.getDay();
  const adjustedOffset = (day === 0) ? offset + 1 : offset;
  const daysToMonday = (day === 0) ? -6 : 1 - day;
  const mon = new Date(now); mon.setDate(now.getDate() + daysToMonday + adjustedOffset * 7);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const pad = n => String(n).padStart(2, '0');
  const key = `${mon.getFullYear()}-${pad(mon.getMonth() + 1)}-${pad(mon.getDate())}`;
  const opts = { day: '2-digit', month: 'short' };
  return { key, label: `${mon.toLocaleDateString('es-CR', opts)} – ${sun.toLocaleDateString('es-CR', opts)} ${sun.getFullYear()}` };
}

function todayDefaultDay() {
  const map = { 1: 'lunes', 2: 'martes', 3: 'miercoles' };
  return map[new Date().getDay()] || 'lunes';
}

const DAY_LABEL = { lunes: 'Lun', martes: 'Mar', miercoles: 'Mié', pickup: 'Pickup' };

// ═══════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════
let CLIENTES = [];
let PEDIDOS = [];
let CONFIRMACIONES = {};
let RUTA_ORDERS = {};
let APODOS = {};
let selectedDay = todayDefaultDay();
let currentStopId = null; // the "current delivery" shown in the big card at the top
let activeStopId = null;  // who the message/call/egg buttons act on — defaults to currentStopId,
                           // but can be overridden by tapping one of the next stops or a route-overlay row
let routeFilter = 'pendientes';
let editingApodo = false;
let STOPS_BY_ID = {};
const wk = getWeekDates(0);

function getConf(clienteId) { return CONFIRMACIONES[`${wk.key}_${clienteId}`] || null; }
function getRutaOrder(dia) { return RUTA_ORDERS[`ruta_order_${wk.key}_${dia}`] || null; }
function getApodo(clienteId) { return APODOS[clienteId] || ''; }

async function saveApodo(clienteId, value) {
  APODOS[clienteId] = value;
  try { await sbUpsert('kv_store', { key: 'apodos', value: JSON.stringify(APODOS) }); }
  catch (e) { console.error(e); toast('⚠️ No se pudo guardar el apodo'); }
}

// ═══════════════════════════════════════════════
// Product breakdown — misma lógica que renderRuta() del CRM original
// ═══════════════════════════════════════════════
function productBreakdown(cliente, conf) {
  const fo = (conf && conf.fmtOverride) || {};
  const hasNewFo = fo['fmt_gsp'] !== undefined || fo['fmt_gcp'] !== undefined || fo['fmt_pcp'] !== undefined;
  const parts = []; // {k, qty}
  if (hasNewFo) {
    ['gsp', 'gcp', 'pcp'].forEach(k => { const qty = fo['fmt_' + k] || 0; if (qty) parts.push({ k, qty }); });
  } else {
    (cliente.fmt || []).forEach(f => {
      const defTipo = f.u === 15 ? 'pcp' : (cliente.seg === 'b2b' ? 'gsp' : 'gcp');
      ['gsp', 'gcp', 'pcp'].forEach(k => {
        const qty = fo['fmt' + f.u + '_' + k] !== undefined ? fo['fmt' + f.u + '_' + k] : (k === defTipo ? f.q : 0);
        if (qty) parts.push({ k, qty });
      });
    });
  }
  return parts;
}
function deductionFromParts(parts) {
  let gsp = 0, gcp = 0, pcp = 0;
  parts.forEach(p => { if (p.k === 'gsp') gsp += p.qty; else if (p.k === 'gcp') gcp += p.qty; else pcp += p.qty; });
  return { gsp, gcp, pcp };
}
const PROD_LABEL = { gsp: 'G-SP', gcp: 'G-CP', pcp: 'P-CP', cafe: 'Café' };

// Si la nota de confirmación (o del pedido) menciona una bolsa de café, se agrega el
// ícono de café a la lista de SKUs a entregar — no hay un campo estructurado para esto.
function withCafeIfNoted(parts, noteText) {
  if (noteText && /caf[eé]/i.test(noteText)) return [...parts, { k: 'cafe', qty: 1 }];
  return parts;
}

// El cartón "pequeño" y el "grande" tienen el mismo ancho real (solo cambia el alto,
// según cuántas filas de huevos dibuja) — por eso el ícono se renderiza al mismo
// tamaño para todos los formatos, escalado proporcionalmente (nunca estirado).
function skuIcon(prodKey) {
  const W = 125; // 96 + 30%
  if (prodKey === 'cafe') {
    const cafeW = Math.round(W * 0.4); // la bolsa de café va al 40% del ancho del cartón
    const h = Math.round(cafeW * 270 / 130);
    return `<svg width="${cafeW}" height="${h}" viewBox="0 0 130 270">${CAFE_ICON_MARKUP}</svg>`;
  }
  const h = Math.round(W * 277 / 296);
  return `<svg width="${W}" height="${h}" viewBox="0 0 296 277">${SKU_ICON_MARKUP[prodKey] || ''}</svg>`;
}

// ═══════════════════════════════════════════════
// Load data
// ═══════════════════════════════════════════════
async function loadAll() {
  try {
    const [clientes, pedidos, kv] = await Promise.all([
      sbGet('clientes', 'estado=eq.activo&select=*'),
      sbGet('pedidos', `week_key=eq.${wk.key}&select=*`),
      sbGet('kv_store', 'select=key,value')
    ]);
    CLIENTES = clientes;
    PEDIDOS = pedidos;
    CONFIRMACIONES = {}; RUTA_ORDERS = {}; APODOS = {};
    kv.forEach(row => {
      if (row.key === 'CONFIRMACIONES') { try { CONFIRMACIONES = JSON.parse(row.value || '{}'); } catch (e) {} }
      if (row.key === 'ruta_orders') { try { RUTA_ORDERS = JSON.parse(row.value || '{}'); } catch (e) {} }
      if (row.key === 'apodos') { try { APODOS = JSON.parse(row.value || '{}'); } catch (e) {} }
    });
    render();
    if (document.getElementById('route-overlay').classList.contains('show')) renderRouteOverlay();
  } catch (e) {
    console.error(e);
    toast('⚠️ Error de conexión — reintentando…');
  }
}

// ═══════════════════════════════════════════════
// Build stop list for selected day — misma fuente que Hoja de Ruta:
// CLIENTES + CONFIRMACIONES (no depende de que pedidos esté generado)
// ═══════════════════════════════════════════════
function buildStops(dia) {
  let confirmed = CLIENTES.filter(c => {
    if (c.estado !== 'activo' || c.ruta !== dia) return false;
    const conf = getConf(c.id);
    return conf && (conf.estado === 'confirmado' || conf.estado === 'cambio');
  });
  const order = getRutaOrder(dia);
  if (order && order.length) {
    const sorted = [];
    order.forEach(id => { const c = confirmed.find(x => x.id === id); if (c) sorted.push(c); });
    confirmed.forEach(c => { if (!sorted.includes(c)) sorted.push(c); });
    confirmed = sorted;
  }
  return confirmed.map(c => {
    const conf = getConf(c.id);
    const pedido = PEDIDOS.find(p => p.id === c.id);
    const parts = productBreakdown(c, conf);
    return { cliente: c, conf, pedido, parts, entregado: pedido ? !!pedido.entregado : false };
  });
}

// "Entrega rápida" (⚡): José logs these as ALREADY delivered, inventory already
// deducted at creation (distinct autoKey namespace: inv_er_*). We only show them
// for visibilidad/totales exactos — nunca como trabajo pendiente, nunca se vuelven a deducir.
function buildQuickStops(dia) {
  return PEDIDOS.filter(p => p.ruta === dia && p.es_entrega_rapida && !(p.auto_key || '').startsWith('vr_'))
    .map(p => {
      const fmt = Array.isArray(p.fmt) ? p.fmt : [];
      const parts = fmt.map(f => {
        const k = f.u === 15 ? 'pcp' : (p.seg === 'b2b' ? 'gsp' : 'gcp');
        return { k, qty: f.q || 0 };
      }).filter(p => p.qty);
      return { isQuick: true, pedido: p, nombre: p.nombre, zona: p.zona, notas: p.notas, tel: p.tel, parts };
    });
}

// ═══════════════════════════════════════════════
// Links
// ═══════════════════════════════════════════════
function wazeUrl(c) {
  if (c.lat && c.lng) return `https://waze.com/ul?ll=${c.lat},${c.lng}&navigate=yes`;
  const addr = encodeURIComponent((c.zona || '') + (c.notas ? ' ' + c.notas : '') + ', Costa Rica');
  return `https://waze.com/ul?q=${addr}&navigate=yes`;
}
function waUrl(c) {
  const digits = (c.tel || '').replace(/\D/g, '');
  return digits ? `https://wa.me/506${digits}` : null;
}
function callUrl(c) {
  const digits = (c.tel || '').replace(/\D/g, '');
  return digits ? `tel:+506${digits}` : null;
}

// ═══════════════════════════════════════════════
// Entregar / Reversar — replica exacta de toggleEntregado() del CRM:
// 1) marca pedidos.entregado  2) escribe deducción idempotente en kv_store.inventario
// ═══════════════════════════════════════════════
async function pedidoRow(stop, entregado) {
  const c = stop.cliente;
  const p = stop.pedido || {};
  return {
    id: c.id,
    week_key: wk.key,
    week_label: p.week_label || wk.label,
    nombre: c.nombre,
    ruta: c.ruta || '',
    zona: c.zona || '',
    notas: c.notas || '',
    tel: c.tel ? String(c.tel) : '',
    fmt: c.fmt || [],
    seg: c.seg || 'domicilio',
    pago: p.pago || 'pendiente',
    entregado,
    nota_cobro: p.nota_cobro || '',
    agregado_manual: p.agregado_manual || false,
    es_entrega_rapida: p.es_entrega_rapida || false,
    auto_key: p.auto_key || ''
  };
}

async function setEntregado(stop, entregado) {
  const invKey = `ruta_${wk.key}_${stop.cliente.id}`;
  try {
    await sbUpsert('pedidos', await pedidoRow(stop, entregado));

    // Leer inventario fresco justo antes de escribir, para minimizar la ventana de carrera
    const kv = await sbGet('kv_store', 'key=eq.inventario&select=value');
    let inv = [];
    try { inv = JSON.parse((kv[0] && kv[0].value) || '[]'); } catch (e) { inv = []; }

    if (entregado) {
      if (!inv.some(i => i.autoKey === invKey)) {
        const { gsp, gcp, pcp } = deductionFromParts(stop.parts);
        inv.push({
          id: Date.now(),
          fecha: new Date().toISOString().split('T')[0],
          tipo: 'entrega',
          desc: 'Entrega: ' + stop.cliente.nombre,
          notas: 'Auto-registrado en ruta (iPad)',
          gsp: -gsp, gcp: -gcp, pcp: -pcp,
          total: -(gsp + gcp + pcp * 0.5),
          autoKey: invKey
        });
        await sbUpsert('kv_store', { key: 'inventario', value: JSON.stringify(inv) });
      }
    } else {
      const filtered = inv.filter(i => i.autoKey !== invKey);
      if (filtered.length !== inv.length) {
        await sbUpsert('kv_store', { key: 'inventario', value: JSON.stringify(filtered) });
      }
    }

    // Reflejar el cambio en el estado local YA, no esperar al próximo poll de 25s
    const idx = PEDIDOS.findIndex(p => p.id === stop.cliente.id);
    if (idx >= 0) PEDIDOS[idx].entregado = entregado;
    else PEDIDOS.push(await pedidoRow(stop, entregado));

    toast(entregado ? '✓ Marcado como entregado' : '↩ Entrega reversada');
    render();
    if (document.getElementById('route-overlay').classList.contains('show')) renderRouteOverlay();
  } catch (e) {
    console.error(e);
    toast('⚠️ No se pudo guardar — reintentá');
  }
}

// Egg button: compute the next pending stop BEFORE awaiting anything, and open
// Waze synchronously inside the tap handler — once we `await`, it's no longer
// a "user gesture" and Safari/WebKit will block a window.open as a popup.
//
// Waze only moves when confirming the CURRENT delivery (the normal sequential flow).
// If the driver manually selected a different upcoming stop and confirmed that one
// instead, they're still on the way to the current stop — Waze must stay put.
function onConfirmClick(clienteId) {
  const stop = STOPS_BY_ID[clienteId];
  if (!stop) return;
  if (clienteId === currentStopId) {
    const stops = buildStops(selectedDay);
    const nextPending = stops.filter(s => !s.entregado && s.cliente.id !== clienteId)[0] || null;
    if (nextPending) {
      openWaze(nextPending.cliente);
      currentStopId = nextPending.cliente.id;
      activeStopId = nextPending.cliente.id;
    } else {
      currentStopId = null;
      activeStopId = null;
    }
  } else {
    // Parada distinta a la actual, confirmada fuera de orden — no navegar, solo
    // volver la selección a la parada actual (comportamiento por defecto).
    activeStopId = currentStopId;
  }
  setEntregado(stop, true);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

// ═══════════════════════════════════════════════
// Selection
// ═══════════════════════════════════════════════
function ensureSelection(stops) {
  const pending = stops.filter(s => !s.entregado);
  // "Current" is always whoever is first in the pending order — not just "still pending
  // somewhere". Without this, dragging a different stop to the top of the route overlay
  // left the old first client stuck as "current" until something else (changing day)
  // happened to invalidate it outright.
  const newCurrent = pending.length ? pending[0].cliente.id : null;
  if (newCurrent !== currentStopId) {
    const wasDefaultActive = activeStopId === currentStopId;
    currentStopId = newCurrent;
    if (wasDefaultActive) activeStopId = newCurrent; // a new "current" resets any manual pick back to default
  }
  const activeValid = pending.some(s => s.cliente.id === activeStopId);
  if (!activeValid) activeStopId = currentStopId;
}

// Tapping one of the next stops (or a row in the full route overlay) only changes who
// the action buttons target — the big card keeps showing the current delivery, per spec.
// Tapping the already-selected one again deselects it back to the default (the current stop).
function selectStop(id) {
  activeStopId = (activeStopId === id) ? currentStopId : id;
  closeRouteOverlay();
  render();
}

// Tapping anywhere on the main screen that isn't an interactive element clears the
// manual selection, same as tapping the selected row again.
function handleBackgroundTap(e) {
  if (e.target.closest('button, .next-row, a')) return;
  if (activeStopId !== currentStopId) {
    activeStopId = currentStopId;
    render();
  }
}

function changeDay(d) {
  selectedDay = d;
  currentStopId = null;
  activeStopId = null;
  render();
  renderRouteOverlay();
}

// Fail-safe: la dirección de cada cliente es tappable y abre Waze directo a ese punto,
// sin depender de que el flujo automático (confirmar → siguiente) dispare la navegación.
// stopPropagation evita que el tap también dispare la selección de la fila que lo contiene.
function addrLink(cliente, innerHtml) {
  return `<a class="addr-link" href="${wazeUrl(cliente)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${innerHtml}</a>`;
}

// En la app instalada desde "Agregar a inicio" (modo standalone), window.open() se bloquea
// en silencio en iOS — un <a> real sí funciona ahí. Por eso cualquier apertura externa que
// no pase por un <a> literal en el HTML (el auto-avance al confirmar, el long-press de
// "próximos", WhatsApp) usa este mismo truco: crear el link y clickearlo de verdad, dentro
// del mismo gesto del usuario.
function openExternal(url) {
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function openWaze(cliente) { openExternal(wazeUrl(cliente)); }

// Guarda la ubicación GPS actual del dispositivo como el pin de Waze de ESE cliente
// (solo el cliente de la entrega actual, no toda la ruta) — mismo campo lat/lng que usa
// el CRM original (ver captureGPS() ahí), pero en un solo tap: sin abrir un formulario,
// se persiste directo a la fila de ese cliente en Supabase.
function setWazePinFromGPS(clienteId) {
  if (!navigator.geolocation) { toast('❌ GPS no disponible'); return; }
  toast('📡 Obteniendo ubicación...');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lat = parseFloat(pos.coords.latitude.toFixed(6));
      const lng = parseFloat(pos.coords.longitude.toFixed(6));
      const c = CLIENTES.find(x => x.id === clienteId);
      if (!c) return;
      try {
        await sbUpsert('clientes', { ...c, lat, lng });
        Object.assign(c, { lat, lng });
        toast('✅ Ubicación de Waze guardada');
        render();
      } catch (e) {
        console.error(e);
        toast('⚠️ No se pudo guardar la ubicación');
      }
    },
    err => toast('❌ ' + (err.message || 'Error de GPS')),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// "Condominio Cerro Real, Casa 74" → nombre del lugar (gris, bold) + unidad final (más
// grande, peso liviano), partiendo por la ÚLTIMA coma. Sin coma, todo queda como "condo".
function addrHTML(notas) {
  if (!notas) return '';
  const idx = notas.lastIndexOf(',');
  if (idx === -1) return `<span class="condo">${notas}</span>`;
  const main = notas.slice(0, idx).trim();
  const unit = notas.slice(idx + 1).trim();
  return `<span class="condo">${main}</span>${unit ? `<span class="casa">${unit}</span>` : ''}`;
}

// ═══════════════════════════════════════════════
// Main screen render
// ═══════════════════════════════════════════════
function render() {
  const stops = buildStops(selectedDay);
  STOPS_BY_ID = {}; stops.forEach(s => STOPS_BY_ID[s.cliente.id] = s);
  const content = document.getElementById('content');

  if (!stops.length) {
    content.innerHTML = '<div class="empty-wrap"><div class="empty-state">Sin clientes confirmados para este día.</div></div>';
    setActionBar(null);
    return;
  }

  ensureSelection(stops);
  const pending = stops.filter(s => !s.entregado);

  if (!pending.length) {
    content.innerHTML = `
      <div class="hero">
        <div class="counter-bar">
          <div class="counter-pill">${stops.length}</div>/<div class="counter-pill dark">${stops.length}</div><span class="counter-label">entregados</span>
          <button class="round-btn" style="margin-left:auto" onclick="openFlashOverlay()" title="Entrega flash">${iconFlash(40)}</button>
          <button class="round-btn" onclick="loadAll()">${iconRefresh(40)}</button>
        </div>
      </div>
      <div class="body-pad">
        <div class="empty-state">✅ Todas las entregas completadas para hoy</div>
        <button class="show-all-btn" onclick="openRouteOverlay()">Ver ruta completa</button>
      </div>`;
    setActionBar(null);
    return;
  }

  const current = STOPS_BY_ID[currentStopId];
  const c = current.cliente;
  const deliveredCount = stops.filter(s => s.entregado).length;
  const curPendingIdx = pending.findIndex(s => s.cliente.id === c.id);
  const others = pending.slice(curPendingIdx + 1, curPendingIdx + 3);

  const skuHTML = withCafeIfNoted(current.parts, current.conf && current.conf.nota).map(p =>
    `<div class="sku"><span class="sku-qty">${p.qty}</span>${skuIcon(p.k)}</div>`
  ).join('');

  content.innerHTML = `
    <div class="hero">
      <div class="counter-bar">
        <div class="counter-pill">${deliveredCount}</div>/<div class="counter-pill dark">${stops.length}</div><span class="counter-label">entregados</span>
        <button class="round-btn" style="margin-left:auto" onclick="openFlashOverlay()" title="Entrega flash">${iconFlash(40)}</button>
        <button class="round-btn" onclick="loadAll()">${iconRefresh(40)}</button>
      </div>
      <div class="delivery-card">${skuHTML}</div>
    </div>
    <div class="body-pad">
      <div class="client-block">
        <div class="client-head">
          <div>
            <div class="client-name">${c.nombre}</div>
            <div class="client-row">
              <div class="client-zona">${c.zona || ''}</div>
              <div class="client-addr">${addrLink(c, addrHTML(c.notas))}</div>
            </div>
          </div>
          <button class="waze-pin-btn" title="Guardar ubicación GPS actual como pin de Waze" onclick="setWazePinFromGPS(${c.id})">${iconWazePin(70)}</button>
        </div>
        ${current.conf && current.conf.nota ? `<div class="note-pill"><span class="warn">${iconNoteWarn(48)}</span>${current.conf.nota}</div>` : ''}
      </div>
      ${others.length ? `
      <div class="next-block">
        <div class="next-rows">
          ${others.map((s, i) => `
            <div class="next-row ${s.cliente.id === activeStopId ? 'selected' : ''} ${i > 0 ? 'faded' : ''}" data-client-id="${s.cliente.id}">
              <div class="idx">${stops.findIndex(x => x.cliente.id === s.cliente.id) + 1}</div>
              <div class="info">
                <div class="name">${s.cliente.nombre}</div>
                <div class="addr">${(s.cliente.zona || '') + (s.cliente.notas ? ' | ' + s.cliente.notas : '')}</div>
              </div>
            </div>`).join('')}
        </div>
        <button class="chevron-btn" onclick="openRouteOverlay()" title="Ver ruta completa">${iconChevron(66)}</button>
      </div>` : `<div class="next-block"><button class="chevron-btn" onclick="openRouteOverlay()" title="Ver ruta completa">${iconChevron(66)}</button></div>`}
      <div class="action-bar">
        <button id="msg-btn" class="round-btn" title="Mensaje">${iconMessage(90)}</button>
        <button id="call-btn" class="round-btn" title="Llamar">${iconCall(90)}</button>
        <button id="egg-btn" class="egg-btn" title="Confirmar entrega">${iconEggConfirm(122)}</button>
      </div>
    </div>`;

  const active = STOPS_BY_ID[activeStopId] || current;
  setActionBar(active.cliente);
  initNextRowGestures();
}

// Un tap corto en cualquier parte de la fila (incluida la dirección) selecciona/deselecciona
// al cliente, igual que antes. Mantener presionado 1.2s o más abre Waze hacia ese cliente —
// el umbral se mide en pointerup (un evento de gesto confiable), así window.open sigue
// contando como originado por el usuario y no lo bloquea el popup blocker de Safari.
// Tocar un "próximo" que NO está seleccionado lo selecciona. Tocar el que YA está
// seleccionado abre Waze hacia ese cliente — el long-press resultó poco confiable en iOS,
// así que el segundo tap sobre el mismo cliente hace ese trabajo en su lugar.
function initNextRowGestures() {
  document.querySelectorAll('.next-row').forEach(row => {
    const id = parseInt(row.dataset.clientId, 10);
    row.addEventListener('click', () => {
      const stop = STOPS_BY_ID[id];
      if (!stop) return;
      if (id === activeStopId) {
        openWaze(stop.cliente);
      } else {
        selectStop(id);
      }
    });
  });
}

function setActionBar(c) {
  const msgBtn = document.getElementById('msg-btn');
  const callBtn = document.getElementById('call-btn');
  const eggBtn = document.getElementById('egg-btn');
  if (!msgBtn || !c) return;
  const wa = waUrl(c), call = callUrl(c);
  msgBtn.disabled = !wa;
  msgBtn.onclick = wa ? () => openMessageOverlay(c.id) : null;
  callBtn.disabled = !call;
  callBtn.onclick = call ? () => { window.location.href = call; } : null;
  eggBtn.onclick = () => onConfirmClick(c.id);
}

// ═══════════════════════════════════════════════
// Message overlay
// ═══════════════════════════════════════════════
function openMessageOverlay(clienteId) {
  const stop = STOPS_BY_ID[clienteId]; if (!stop) return;
  editingApodo = false;
  renderMessageOverlay(stop);
  document.getElementById('message-overlay').classList.add('show');
}
function closeMessageOverlay() { document.getElementById('message-overlay').classList.remove('show'); }

function defaultMessage(c) {
  const apodo = getApodo(c.id) || (c.nombre || '').split(' ')[0];
  return `¡Hola, ${apodo}! En unos 5 minutos estoy llegando con la entrega de huevos. 🍳`;
}

function renderMessageOverlay(stop) {
  const c = stop.cliente;
  const apodo = getApodo(c.id);
  document.getElementById('message-overlay-body').innerHTML = `
    <div class="msg-header">
      <div class="msg-name">${c.nombre}</div>
      <button class="msg-edit-apodo" onclick="toggleEditApodo(${c.id})">✎ ${apodo ? 'Apodo: ' + apodo : 'Agregar apodo'}</button>
    </div>
    ${editingApodo ? `
    <div class="apodo-edit-row">
      <input id="apodo-input" value="${apodo}" placeholder="Nombre corto">
      <button class="round-btn dark sm" onclick="confirmApodo(${c.id})">✓</button>
    </div>` : ''}
    <div class="msg-bubble">
      <textarea id="msg-textarea" class="msg-textarea">${defaultMessage(c)}</textarea><br>
      <button class="send-btn" onclick="sendTemplateMessage(${c.id})">${iconSend(52)}</button>
    </div>
    <div class="msg-alt-row">
      <button class="msg-close" onclick="closeMessageOverlay()">${iconCancel(64)}</button>
      <button class="round-btn" title="Dictar con Whispr Flow en WhatsApp" onclick="openWhatsAppChat(${c.id})">${iconMsgOverlay(64)}</button>
    </div>`;
}

function toggleEditApodo(id) { editingApodo = !editingApodo; renderMessageOverlay(STOPS_BY_ID[id]); }
function confirmApodo(id) {
  const val = document.getElementById('apodo-input').value.trim();
  saveApodo(id, val);
  editingApodo = false;
  renderMessageOverlay(STOPS_BY_ID[id]);
}
function sendTemplateMessage(id) {
  const c = STOPS_BY_ID[id].cliente;
  const text = document.getElementById('msg-textarea').value;
  const wa = waUrl(c);
  if (!wa) { toast('⚠️ Cliente sin teléfono'); return; }
  openExternal(wa + '?text=' + encodeURIComponent(text));
}
function openWhatsAppChat(id) {
  const c = STOPS_BY_ID[id].cliente;
  const wa = waUrl(c);
  if (!wa) { toast('⚠️ Cliente sin teléfono'); return; }
  openExternal(wa);
}

// ═══════════════════════════════════════════════
// Entrega flash — replica el núcleo de guardarEntregaRapida() del CRM original:
// mismo rango de ID sintético para el pedido, mismo namespace separado ('inv_'+erKey)
// para la deducción de inventario, para que nunca choque ni se vuelva a deducir sola.
// A diferencia del original, acá no hay buscador de cliente existente (una entrega
// flash es, por definición, alguien fuera de la ruta confirmada) ni edición de precio.
// ═══════════════════════════════════════════════
let flashT30 = 'gcp';
// true (encendido) = con plástico, false = sin plástico — son los únicos 2 buckets de
// inventario reales para el cartón grande (G-CP/G-SP), así que no hace falta más que esto.
function setFlashT30(t) {
  flashT30 = t;
  document.getElementById('flash-t30-toggle').checked = (t === 'gcp');
  document.getElementById('flash-t30-label').textContent = t === 'gcp' ? 'Con plástico' : 'Sin plástico';
}
function onFlashT30Toggle(isOn) { setFlashT30(isOn ? 'gcp' : 'gsp'); }
// Buscador de cliente existente (igual que renderEntregaClienteSearch/selectEntregaCliente
// del CRM original): una entrega flash también puede ser para alguien que YA es cliente
// (un extra puntual fuera de lo ya confirmado), no solo gente nueva. Si se elige uno de la
// lista, se autocompleta su teléfono/zona/formato y se destilda "agregar como cliente" para
// no crear un duplicado de alguien que ya existe en la base.
function renderFlashClienteSearch(q) {
  const container = document.getElementById('flash-cli-results');
  const query = (q || '').trim().toLowerCase();
  if (!query) { container.innerHTML = ''; return; }
  const matches = CLIENTES.filter(c => c.estado === 'activo' && c.nombre.toLowerCase().includes(query)).slice(0, 5);
  if (!matches.length) { container.innerHTML = ''; return; }
  container.innerHTML = matches.map(c => {
    const fmtLabel = (c.fmt || []).map(f => `${f.q}×${f.u}u`).join(' + ');
    return `<div class="flash-search-row" onclick="selectFlashCliente(${c.id})"><b>${c.nombre}</b><span class="zona">${c.zona || ''} · ${fmtLabel}</span></div>`;
  }).join('');
}
function selectFlashCliente(id) {
  const c = CLIENTES.find(x => x.id === id);
  if (!c) return;
  document.getElementById('flash-nombre').value = c.nombre;
  document.getElementById('flash-tel').value = c.tel || '';
  document.getElementById('flash-zona').value = c.zona || '';
  document.getElementById('flash-notas').value = c.notas || '';
  const f30 = (c.fmt || []).find(f => f.u === 30);
  const f15 = (c.fmt || []).find(f => f.u === 15);
  document.getElementById('flash-q30').value = f30 ? f30.q : 0;
  document.getElementById('flash-q15').value = f15 ? f15.q : 0;
  setFlashT30(c.seg === 'b2b' ? 'gsp' : 'gcp');
  document.getElementById('flash-add-crm').checked = false;
  document.getElementById('flash-cli-results').innerHTML = '';
}

function openFlashOverlay() {
  document.getElementById('flash-nombre').value = '';
  document.getElementById('flash-tel').value = '';
  document.getElementById('flash-zona').value = '';
  document.getElementById('flash-notas').value = '';
  document.getElementById('flash-q30').value = 1;
  document.getElementById('flash-q15').value = 0;
  document.getElementById('flash-add-crm').checked = false;
  document.getElementById('flash-cli-results').innerHTML = '';
  setFlashT30('gcp');
  document.getElementById('flash-overlay').classList.add('show');
}
function closeFlashOverlay() { document.getElementById('flash-overlay').classList.remove('show'); }

async function saveFlashDelivery() {
  const nombre = document.getElementById('flash-nombre').value.trim();
  if (!nombre) { toast('⚠️ El nombre es obligatorio'); return; }
  const tel = document.getElementById('flash-tel').value.trim();
  const zona = document.getElementById('flash-zona').value.trim();
  const notas = document.getElementById('flash-notas').value.trim();
  const q30 = parseInt(document.getElementById('flash-q30').value) || 0;
  const q15 = parseInt(document.getElementById('flash-q15').value) || 0;
  const addToClientes = document.getElementById('flash-add-crm').checked;
  if (!q30 && !q15) { toast('⚠️ Indicá al menos una cantidad'); return; }

  const p30 = 5000, p15 = 3000;
  const fmt = [];
  if (q30 > 0) fmt.push({ u: 30, q: q30, p: p30 });
  if (q15 > 0) fmt.push({ u: 15, q: q15, p: p15 });

  const ts = Date.now();
  const erId = 800000000 + (ts % 99999999);
  const erKey = 'er_' + ts;
  // El modelo original no tiene un campo de empaque independiente: G-SP va atado al
  // segmento b2b y G-CP al segmento domicilio (ver productBreakdown/buildQuickStops).
  const seg = flashT30 === 'gsp' ? 'b2b' : 'domicilio';

  const pedido = {
    id: erId, week_key: wk.key, week_label: wk.label,
    nombre, ruta: selectedDay, zona, notas, tel,
    fmt, seg, pago: 'pendiente',
    entregado: true, nota_cobro: '', agregado_manual: true,
    es_entrega_rapida: true, auto_key: erKey
  };

  try {
    await sbUpsert('pedidos', pedido);

    const kv = await sbGet('kv_store', 'key=eq.inventario&select=value');
    let inv = [];
    try { inv = JSON.parse((kv[0] && kv[0].value) || '[]'); } catch (e) { inv = []; }
    const gsp = flashT30 === 'gsp' ? q30 : 0;
    const gcp = flashT30 === 'gcp' ? q30 : 0;
    const pcp = q15;
    inv.push({
      id: Date.now(),
      fecha: new Date().toISOString().split('T')[0],
      tipo: 'entrega', desc: 'Entrega extra: ' + nombre, notas: 'Entrega flash (huevoruta)',
      gsp: -gsp, gcp: -gcp, pcp: -pcp,
      total: -(gsp + gcp + pcp * 0.5),
      autoKey: 'inv_' + erKey
    });
    await sbUpsert('kv_store', { key: 'inventario', value: JSON.stringify(inv) });

    if (addToClientes) {
      // Rango propio (900000000+) para que un cliente nuevo creado desde acá nunca
      // choque con un id real (los clientes reales son enteros chicos, secuenciales).
      const newClienteId = 900000000 + (ts % 99999999);
      await sbUpsert('clientes', {
        id: newClienteId, nombre, tel, zona, notas,
        seg, ruta: selectedDay, fmt,
        estado: 'activo', freq: 'semanal'
      });
    }

    PEDIDOS.push(pedido);
    closeFlashOverlay();
    toast('⚡ Entrega flash registrada');
    render();
    if (document.getElementById('route-overlay').classList.contains('show')) renderRouteOverlay();
  } catch (e) {
    console.error(e);
    toast('⚠️ No se pudo guardar la entrega flash');
  }
}

// ═══════════════════════════════════════════════
// Route overlay (full day, drag-reorder, pendientes/entregados)
// ═══════════════════════════════════════════════
function openRouteOverlay() {
  renderRouteOverlay();
  document.getElementById('route-overlay').classList.add('show');
}
function closeRouteOverlay() { document.getElementById('route-overlay').classList.remove('show'); }

function setRouteFilter(f) { routeFilter = f; renderRouteOverlay(); }

function renderRouteOverlay() {
  document.getElementById('route-pills').innerHTML = ['lunes', 'martes', 'miercoles', 'pickup'].map(d =>
    `<button class="day-chip ${d === selectedDay ? 'active' : ''}" onclick="changeDay('${d}')">${DAY_LABEL[d]}</button>`
  ).join('');

  const stops = buildStops(selectedDay);
  const quick = buildQuickStops(selectedDay);
  const list = routeFilter === 'pendientes' ? stops.filter(s => !s.entregado) : stops.filter(s => s.entregado);

  // El número mostrado es la posición absoluta dentro del día completo (igual que el
  // contador de la tarjeta principal), no la posición dentro de esta sublista filtrada —
  // si no, al entregarle al #1 la lista de pendientes "reiniciaba" y volvía a empezar en 1.
  let html = list.map(s => paradaRow(s, stops.findIndex(x => x.cliente.id === s.cliente.id), routeFilter === 'pendientes')).join('');
  if (routeFilter === 'entregados' && quick.length) html += quick.map(quickParadaRow).join('');
  if (!html) html = `<div class="empty-state" style="color:rgba(255,255,255,0.5)">${routeFilter === 'pendientes' ? 'No quedan paradas pendientes.' : 'Nada entregado todavía.'}</div>`;

  document.getElementById('route-list-body').innerHTML = html;
  document.querySelectorAll('.filter-switch button').forEach(b => b.classList.toggle('active', b.dataset.filter === routeFilter));
  if (routeFilter === 'pendientes') initRouteDragDrop();
}

// Pequeña identificación de qué formato/SKU pidió cada cliente, para la lista completa.
// El café se marca distinto (no es un formato de huevos) para que salte a la vista.
function skuBadges(parts) {
  if (!parts || !parts.length) return '';
  return `<div class="parada-skus">${parts.map(p => p.k === 'cafe'
    ? `<span class="parada-sku cafe">☕ Café</span>`
    : `<span class="parada-sku"><b>${p.qty}</b> ${PROD_LABEL[p.k] || p.k}</span>`
  ).join('')}</div>`;
}

// Misma nota de confirmación que se muestra en la tarjeta principal (note-pill),
// pero en formato compacto para una fila de la lista completa.
function noteLine(nota) {
  return nota ? `<div class="parada-note"><span class="warn">${iconNoteWarn(20)}</span>${nota}</div>` : '';
}

function paradaRow(s, i, draggable) {
  const c = s.cliente;
  const addr = (c.zona || '') + (c.notas ? ' — ' + c.notas : '');
  const nota = s.conf && s.conf.nota;
  const parts = withCafeIfNoted(s.parts, nota);
  if (draggable) {
    return `
    <div class="parada-row" data-client-id="${c.id}">
      <div class="drag-handle">⠿</div>
      <div class="idx">${i + 1}</div>
      <div class="info" onclick="selectStop(${c.id})">
        <div class="name">${c.nombre}</div>
        <div class="addr">${addrLink(c, addr)}</div>
        ${skuBadges(parts)}
        ${noteLine(nota)}
      </div>
    </div>`;
  }
  return `
    <div class="parada-row">
      <div class="idx">✓</div>
      <div class="info"><div class="name">${c.nombre}</div><div class="addr">${addrLink(c, addr)}</div>${skuBadges(parts)}${noteLine(nota)}</div>
      <button class="round-btn dark sm" onclick="setEntregado(STOPS_BY_ID[${c.id}], false)">↩</button>
    </div>`;
}
function quickParadaRow(q) {
  const addr = (q.zona || '') + (q.notas ? ' — ' + q.notas : '');
  const parts = withCafeIfNoted(q.parts, q.notas);
  return `
    <div class="parada-row">
      <div class="idx">⚡</div>
      <div class="info"><div class="name">${q.nombre}</div><div class="addr">${addrLink(q, addr)}</div>${skuBadges(parts)}</div>
    </div>`;
}

// Pointer Events (no HTML5 drag-and-drop): el DnD nativo no dispara en touch
// (iOS/Android), solo con mouse — mismo tipo de limitación de gestos táctiles ya
// encontrada con el long-press. Arrastre real desde .drag-handle, con
// setPointerCapture para que el drag siga funcionando aunque el dedo se mueva
// sobre otras filas, y reordenando el DOM en vivo según la posición del dedo.
function initRouteDragDrop() {
  const container = document.getElementById('route-list-body');
  const getRows = () => [...container.querySelectorAll('.parada-row[data-client-id]')];
  let dragRow = null;

  container.querySelectorAll('.parada-row[data-client-id] .drag-handle').forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      dragRow = handle.closest('.parada-row');
      dragRow.classList.add('parada-dragging');
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', e => {
      if (!dragRow) return;
      e.preventDefault();
      const y = e.clientY;
      const rows = getRows();
      const after = rows.find(r => r !== dragRow && y < r.getBoundingClientRect().top + r.getBoundingClientRect().height / 2);
      if (after) {
        if (after.previousElementSibling !== dragRow) container.insertBefore(dragRow, after);
      } else if (rows[rows.length - 1] !== dragRow) {
        container.appendChild(dragRow);
      }
    });
    const endDrag = e => {
      if (!dragRow) return;
      dragRow.classList.remove('parada-dragging');
      const newOrder = getRows().map(r => parseInt(r.dataset.clientId));
      dragRow = null;
      persistNewOrder(newOrder);
    };
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  });
}

function persistNewOrder(newPendingOrder) {
  const stops = buildStops(selectedDay);
  const doneIds = stops.filter(s => s.entregado).map(s => s.cliente.id);
  const key = `ruta_order_${wk.key}_${selectedDay}`;
  RUTA_ORDERS[key] = [...newPendingOrder, ...doneIds];
  sbUpsert('kv_store', { key: 'ruta_orders', value: JSON.stringify(RUTA_ORDERS) }).catch(e => console.error(e));
  render();
  renderRouteOverlay();
}

// Init
// ═══════════════════════════════════════════════
loadAll();
setInterval(loadAll, 25000); // mismo espíritu que el auto-sync de 30s del CRM original
</script>
