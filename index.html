// Simula el consumo de cajas para lo que resta del día (recalculado de cero cada vez
// que se aprieta el botón — es una recomendación de planificación, no un inventario
// físico en vivo: las cajas de cabina arrancan llenas en cada corrida).
// Reglas aplicadas (confirmadas con Juani):
//  - G-SP (sin plástico) nunca vive en cabina: siempre sale de la caja de carga.
//  - G-CP (con plástico) vive fijo en el copiloto. Si hace falta una caja ENTERA (10)
//    y todavía no se abrió ninguna caja de G-CP en la caja de carga (o la última ya
//    se cerró llena), se saca directo de una caja nueva de atrás sin tocar el copiloto.
//    Si no (pedido chico, o la de atrás ya está empezada/parcial), se usa el copiloto;
//    cuando el copiloto se vacía del todo, la siguiente caja de G-CP de atrás pasa a
//    hacer de copiloto para lo que sigue — ej: quedan 1, hace falta 2 → se toma el 1
//    que quedaba, se trae la caja nueva, y de esa se toma el otro 1, quedando 9.
//  - P-CP (chico con plástico) funciona igual, pero contra el pool de los 2 asientos
//    traseros en vez del copiloto.
// Las cajas de la caja de carga quedan numeradas en el orden en que se van abriendo
// durante la simulación — ese orden es exactamente crate_bed_1..10.
const CRATE_CARTONES = 10; // tamaño de una caja en "cartones" (grande=1, chico=0.5 → 20 chicos)
function capacityOf(sku) { return sku === 'pcp' ? CRATE_CARTONES * 2 : CRATE_CARTONES; }
function equivOf(sku, qty) { return sku === 'pcp' ? qty * 0.5 : qty; }
// G-CP y P-CP van envueltos en plástico, G-SP no — nunca se combina una caja parcial
// "con plástico" con una "sin plástico" en la misma caja física.
function hasPlastic(sku) { return sku === 'gcp' || sku === 'pcp'; }

// cabinCutoffIdx: índice (en `stops`) del cliente del punto de refill, inclusive — a
// partir de la parada siguiente, la cabina ya no se sigue vaciando en la simulación
// (en la realidad el repartidor le sigue sacando cartones, pero eso ya pasó esta mañana:
// lo que haga falta de ahí en más sale directo de la caja de carga). null = sin límite,
// el día entero puede tocar la cabina (no hay refill, o ya se pasó el punto y el cliente
// del punto ya no está en `stops` — ver assignLoad).
function computeLoadPlan(stops, cabinCutoffIdx, caps) {
  // caps: { copilotCap, pcpCap } — cuánto lugar accesible hay hoy (ver cabinCapsForPersonas,
  // varía según PERSONAS_EN_RUTA). Sin caps, se asume el vehículo completo (1 persona).
  let copilotLeft = caps ? caps.copilotCap : CRATE_CARTONES;        // 1 caja de 10 (copiloto)
  let backseatLeft = caps ? caps.pcpCap : CRATE_CARTONES * 2 * 2;   // 2 cajas de 20 chicos, agrupadas (= 40)
  const bedCrates = []; // en orden de apertura — una sola secuencia por SKU, nunca dos en paralelo

  function openBedCrate(sku, capacity) {
    const crate = { sku, used: 0, capacity };
    bedCrates.push(crate);
    return crate;
  }
  function lastOpenCrate(sku) {
    const of_ = bedCrates.filter(c => c.sku === sku);
    return of_.length ? of_[of_.length - 1] : null;
  }
  // Única función que toca la caja de carga: si la última caja abierta de esa SKU
  // todavía tiene lugar la sigue llenando, si no abre una nueva — tanto un pedido
  // grande servido directo desde atrás como un relleno de cabina pasan por acá, así
  // nunca quedan dos cajas parciales de la misma SKU abiertas al mismo tiempo.
  function consumeFromBed(sku, capacity, amount) {
    let crate = lastOpenCrate(sku);
    while (amount > 0) {
      if (!crate || crate.used >= crate.capacity) crate = openBedCrate(sku, capacity);
      const take = Math.min(amount, crate.capacity - crate.used);
      crate.used += take;
      amount -= take;
    }
  }
  // Consume de la fuente accesible (copiloto o asiento trasero); si se vacía a mitad
  // de un pedido, una caja entera de la caja de carga "se muda" a la cabina (regla 6) —
  // siempre a través de consumeFromBed, para reusar cualquier caja ya empezada.
  function consumeFromAccessible(sku, capacity, amount, getLeft, setLeft) {
    let qty = amount;
    while (qty > 0) {
      if (getLeft() <= 0) {
        consumeFromBed(sku, capacity, capacity);
        setLeft(capacity);
      }
      const take = Math.min(qty, getLeft());
      setLeft(getLeft() - take);
      qty -= take;
    }
  }

  // Cuántas cajas de la caja de carga llevan abiertas justo después de cada parada —
  // así después se puede encontrar "hasta dónde llegó" el primer tramo (hasta el
  // cliente del punto de refill) sin tener que simular ese tramo por separado.
  const stopCrateCounts = [];

  stops.forEach((s, i) => {
    const cabinOpen = cabinCutoffIdx == null || i <= cabinCutoffIdx;
    const nota = s.conf && s.conf.nota;
    const parts = withCafeIfNoted(s.parts, nota);
    const need = { gsp: 0, gcp: 0, pcp: 0 };
    parts.forEach(p => { if (need[p.k] !== undefined) need[p.k] += p.qty; });

    if (need.gsp > 0) consumeFromBed('gsp', CRATE_CARTONES, need.gsp);

    if (need.gcp > 0) {
      if (!cabinOpen) {
        consumeFromBed('gcp', CRATE_CARTONES, need.gcp);
      } else {
        const lastGcp = lastOpenCrate('gcp');
        const bedHasPartial = !!(lastGcp && lastGcp.used < lastGcp.capacity);
        // Caja llena directo de atrás solo si el pedido llena una caja entera, el
        // copiloto sigue intacto y no hay ninguna caja de atrás ya empezada esperando.
        if (need.gcp >= CRATE_CARTONES && copilotLeft === CRATE_CARTONES && !bedHasPartial) {
          consumeFromBed('gcp', CRATE_CARTONES, need.gcp);
        } else {
          consumeFromAccessible('gcp', CRATE_CARTONES, need.gcp, () => copilotLeft, v => { copilotLeft = v; });
        }
      }
    }

    if (need.pcp > 0) {
      if (!cabinOpen) consumeFromBed('pcp', CRATE_CARTONES * 2, need.pcp);
      else consumeFromAccessible('pcp', CRATE_CARTONES * 2, need.pcp, () => backseatLeft, v => { backseatLeft = v; });
    }

    stopCrateCounts.push(bedCrates.length);
  });

  return { bedCrates, copilotLeft, backseatLeft, stopCrateCounts };
}

// Lógica de refill ("codename Monday"): si el día entero no entra en las 10 cajas de
// la caja de carga pero se fijó un punto de refill, el primer tramo (hasta ese
// cliente) va en las primeras posiciones y las últimas entregas del día — las que de
// todas formas no se van a tocar hasta mucho más tarde — se precargan de una en las
// últimas posiciones. Lo que queda en el medio ("cajas del medio") no entra en el
// viaje de salida: se trae recién en el refill, así que no se le asigna posición acá.
function splitForRefill(stops, raw, stopCrateCounts) {
  const boundaryIdx = stops.findIndex(s => s.cliente.id === refillBoundaryClientId);
  if (boundaryIdx === -1) return null;
  const K = stopCrateCounts[boundaryIdx];
  const R = 10 - K;
  if (R < 0) return { impossible: true };
  const front = raw.slice(0, K);
  const back = R > 0 ? raw.slice(raw.length - R) : [];
  const middle = raw.slice(K, raw.length - R);
  return { front, back, middle };
}

// Rescate de capacidad: el simulador nunca deja más de 1 caja parcial abierta por SKU
// a la vez, así que si al final del día el total se pasa de 10, lo más que puede haber
// esperando son 3 parciales (una por G-SP/G-CP/P-CP) — cada una con lugar libre que de
// otra forma queda desperdiciado. Solo se intenta combinar cuando hace falta (día que
// no entra en 10 cajas) — si ya entran todas sueltas, se dejan sueltas. Al combinar,
// nunca se mezcla una parcial "con plástico" (G-CP/P-CP) con una "sin plástico" (G-SP)
// en la misma caja física — eso deja a G-SP siempre sola si es la única de su tipo.
function tryMergePartials(bedCrates) {
  const equiv = c => c.sku === 'pcp' ? c.used * 0.5 : c.used;
  const full = bedCrates.filter(c => c.used >= c.capacity);
  const partials = bedCrates.filter(c => c.used > 0 && c.used < c.capacity);
  if (partials.length < 2) return bedCrates; // nada para combinar

  // Combinar de a pares del mismo tipo de envoltorio, lo que más aproveche el
  // espacio primero. La que no tenga con qué combinarse queda sola.
  const sorted = partials.slice().sort((a, b) => equiv(b) - equiv(a));
  const used = new Array(sorted.length).fill(false);
  const result = [];
  for (let i = 0; i < sorted.length; i++) {
    if (used[i]) continue;
    let bestJ = -1, bestSum = -1;
    for (let j = i + 1; j < sorted.length; j++) {
      if (used[j] || hasPlastic(sorted[i].sku) !== hasPlastic(sorted[j].sku)) continue;
      const sum = equiv(sorted[i]) + equiv(sorted[j]);
      if (sum <= 10 && sum > bestSum) { bestSum = sum; bestJ = j; }
    }
    if (bestJ >= 0) {
      result.push({ mixed: true, contents: [
        { sku: sorted[i].sku, qty: sorted[i].used },
        { sku: sorted[bestJ].sku, qty: sorted[bestJ].used }
      ] });
      used[i] = true; used[bestJ] = true;
    } else {
      result.push(sorted[i]);
      used[i] = true;
    }
  }
  return full.concat(result);
}

// Arma la asignación final de las 13 cajas: cabina (copiloto, asiento trasero derecho e
// izquierdo) + hasta 10 de la caja de carga. Si el día no entra suelto en 10 cajas, las
// parciales que el simulador deja al final se combinan (nunca mezclando plástico con
// sin-plástico) y, si arman una caja mixta, esa va a uno de los asientos traseros —
// derecho primero, después izquierdo — nunca al copiloto, liberando lugar en la caja
// de carga en vez de ocuparlo. Si el día entra suelto en 10, no se combina nada: una
// parcial que quedó sola (no es mezcla) se queda en su lugar normal.
function assignLoad(stops) {
  // Si el punto de refill todavía está sin entregar hoy, la cabina deja de recibir más
  // allá de ese cliente (ver cabinCutoffIdx en computeLoadPlan) — así lo que se congela
  // en BASE_LOAD (recomputeLoadFresh) refleja la cabina tal cual queda justo al
  // llegar al refill, no el total de todo el día. Una vez que ese cliente ya se entregó
  // (no aparece más en `stops`), el boundary no se encuentra y esto vuelve a portarse
  // como un día sin refill (cabinCutoffIdx null, sin límite) para lo que quede del día.
  const boundaryIdx = refillBoundaryClientId != null ? stops.findIndex(s => s.cliente.id === refillBoundaryClientId) : -1;
  const cabinCutoffIdx = boundaryIdx !== -1 ? boundaryIdx : null;
  const caps = cabinCapsForPersonas(PERSONAS_EN_RUTA);
  const { bedCrates: raw, copilotLeft, backseatLeft, stopCrateCounts } = computeLoadPlan(stops, cabinCutoffIdx, caps);

  // Si el día no entra en 10 cajas pero ya se fijó un punto de refill, el primer
  // tramo + las últimas entregas del día (precargadas) reemplazan a la secuencia
  // completa — lo que queda en el medio se trae recién en el refill, no se carga
  // ahora. Si no se pudo (no se fijó el punto, no se encontró el cliente, o el
  // primer tramo solo ya no entra), sigue el camino normal de abajo.
  let bedBase = raw;
  let middleCount = 0;
  if (raw.length > 10 && refillBoundaryClientId != null) {
    const split = splitForRefill(stops, raw, stopCrateCounts);
    if (split && !split.impossible) {
      bedBase = split.front.concat(split.back);
      middleCount = split.middle.length;
    }
  }

  // Combinar parciales solo cuando hace falta rescatar lugar (needsCabinRescue): si el
  // día ya entra suelto en 10 cajas, se deja suelto, aunque haya parciales que
  // cabrían juntas — no hace falta combinar si hay lugar de sobra. Cuando sí hace
  // falta, la mezcla nunca va al copiloto (ese asiento es siempre G-CP, nunca una
  // mezcla de sobras) — solo a uno de los dos asientos traseros.
  const needsCabinRescue = bedBase.length > 10;
  const merged = needsCabinRescue ? tryMergePartials(bedBase) : bedBase;
  const mixedCrates = merged.filter(c => c.mixed);
  const singleCrates = merged.filter(c => !c.mixed);

  // Con 1 sola persona (el repartidor), los dos asientos traseros son P-CP agrupado
  // (no hay forma de saber cuál se vacía primero, así que se reparte asumiendo que el
  // derecho se vacía primero — solo para poder mostrar/usar cada caja física por
  // separado). Con 2 o 3 personas, el copiloto no tiene caja (ese asiento lo ocupa una
  // persona) y su cupo de G-CP se corre al asiento trasero izquierdo en su lugar — el
  // derecho sigue siendo P-CP con 2 personas, y deja de usarse también con 3.
  let cabin;
  if (PERSONAS_EN_RUTA === 1) {
    const backseatUsedTotal = caps.pcpCap - backseatLeft;
    const usedRight = Math.min(CRATE_CARTONES * 2, backseatUsedTotal);
    const usedLeft = Math.max(0, backseatUsedTotal - CRATE_CARTONES * 2);
    cabin = {
      copilot: { slot: 'copilot', sku: 'gcp', used: caps.copilotCap - copilotLeft, capacity: caps.copilotCap },
      backseat_right: { slot: 'backseat_right', sku: 'pcp', used: usedRight, capacity: CRATE_CARTONES * 2 },
      backseat_left: { slot: 'backseat_left', sku: 'pcp', used: usedLeft, capacity: CRATE_CARTONES * 2 },
    };
  } else {
    cabin = {
      copilot: { slot: 'copilot', sku: 'gcp', used: 0, capacity: 0 },
      backseat_right: { slot: 'backseat_right', sku: 'pcp', used: caps.pcpCap - backseatLeft, capacity: caps.pcpCap },
      backseat_left: { slot: 'backseat_left', sku: 'gcp', used: caps.copilotCap - copilotLeft, capacity: caps.copilotCap },
    };
  }
  // Las mezclas de parciales solo se mandan a la cabina cuando hace falta rescatar
  // lugar (needsCabinRescue), y nunca al copiloto (siempre G-CP fijo) — solo a uno de
  // los asientos traseros, y solo al que tenga caja de verdad hoy (capacity>0): si una
  // persona lo está ocupando, no hay lugar físico ahí para nada.
  const cabinOrder = needsCabinRescue
    ? ['backseat_right', 'backseat_left'].filter(slot => cabin[slot].capacity > 0)
    : [];
  mixedCrates.slice(0, cabinOrder.length).forEach((m, i) => {
    cabin[cabinOrder[i]] = { slot: cabinOrder[i], mixed: true, contents: m.contents, capacity: CRATE_CARTONES };
  });
  // si hubiera más mezclas que asientos con caja disponibles hoy, las que sobran van a
  // la caja de carga en vez de perderse.
  const overflowMixed = mixedCrates.slice(cabinOrder.length).map(m => ({ mixed: true, contents: m.contents, capacity: CRATE_CARTONES }));

  const bed = singleCrates.concat(overflowMixed).map((c, i) => ({
    slot: 'bed_' + (i + 1), sku: c.sku, mixed: c.mixed, contents: c.contents, used: c.used, capacity: c.capacity
  }));

  return { cabin, bed, overflow: bed.length > 10, middleCount };
}

function allLoadSlots(load) {
  return [load.cabin.copilot, load.cabin.backseat_right, load.cabin.backseat_left].concat(load.bed);
}
// Ojo: usa crate.capacity (no la constante CRATE_CARTONES a secas) — una caja mixta
// puede tener una capacidad distinta de la default, y mergeExtrasIntoLoad() se apoya en
// esto para no inventar lugar donde no hay.
function remainingEquiv(crate) {
  if (crate.mixed) return crate.capacity - crate.contents.reduce((s, c) => s + equivOf(c.sku, c.qty), 0);
  return equivOf(crate.sku, crate.capacity - crate.used);
}

// Qué hay HOY en una caja tocada en la pantalla 3D — mismo lenguaje visual (ícono +
// cantidad) que las fichas del dashboard, mostrado en la franja arriba del vehículo.
// Con 5 cajas o menos en la caja de carga entran todas en el nivel de abajo (nada
// apilado encima de otra caja) — las posiciones físicas que se usan son la 2, 4, 6, 8
// y 10 del modelo (el nivel de arriba, 1/3/5/7/9, queda vacío).
// Con más de 5 ya no entran en el nivel de abajo solo: siempre se termina de llenar
// ese nivel primero (2,4,6,8,10, las 5 posiciones) y recién ahí se empieza a apilar
// arriba — de adelante (posición 1, la más accesible) hacia atrás (3, 5, 7, 9).
// Esto es la lógica de LLENADO (en qué posición física entra cada caja), que no es lo
// mismo que el orden de ENTREGA: la primera caja que hace falta en la ruta (la más
// urgente) se pone en la posición más accesible que quede libre, y la última caja que
// hace falta (la que menos apuro tiene) termina en la posición menos accesible.
const SINGLE_LEVEL_BED_ORDER = [2, 4, 6, 8, 10];
const UPPER_LEVEL_FILL_ORDER = [1, 3, 5, 7, 9];
function bedPhysicalOrder(bedCount) {
  if (bedCount <= 5) return SINGLE_LEVEL_BED_ORDER;
  const upperNeeded = bedCount - 5;
  return UPPER_LEVEL_FILL_ORDER.slice(0, upperNeeded).concat(SINGLE_LEVEL_BED_ORDER);
}
// Índice dentro de load.bed (orden en el que se van a entregar) que le corresponde a la
// posición física `crateNum` (1..10) del modelo 3D — o -1 si esa posición no se usa hoy.
function bedLogicalIndexForCrateNum(crateNum, bedCount) {
  return bedPhysicalOrder(bedCount).indexOf(crateNum);
}

function loadSlotForCrateName(name) {
  if (!CURRENT_LOAD) return null;
  if (name === 'crate_copilot') return CURRENT_LOAD.cabin.copilot;
  if (name === 'crate_backseat_right') return CURRENT_LOAD.cabin.backseat_right;
  if (name === 'crate_backseat_left') return CURRENT_LOAD.cabin.backseat_left;
  const m = /^crate_bed_(\d+)$/.exec(name);
  if (!m) return null;
  const idx = bedLogicalIndexForCrateNum(parseInt(m[1], 10), CURRENT_LOAD.bed.length);
  return idx === -1 ? null : (CURRENT_LOAD.bed[idx] || null);
}
// Mismo tamaño que las fichas del dashboard ("Por entregar": skuIcon/dashIconPcp a 72px,
// .dash-num a 36px/400) — para que los íconos de esta franja no desentonen en escala.
function crateInfoItemHTML(sku, qty) {
  const icon = sku === 'pcp' ? dashIconPcp(72) : skuIcon(sku, 72);
  const qtyFmt = Number.isInteger(qty) ? qty : qty.toFixed(1);
  return `<div class="crate-info-item"><div class="crate-info-qty">${qtyFmt}</div>${icon}</div>`;
}

// Mismo tono de la caja en el 3D (CRATE_SKU_COLORS), llevado a un pastel claro mezclando
// con blanco — para que el fondo de la franja de íconos quede legible y sutil.
function crateIconsTint(hex) {
  const r = (hex >> 16) & 0xFF, g = (hex >> 8) & 0xFF, b = hex & 0xFF;
  const mix = c => Math.round(c + (255 - c) * 0.78);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}

// Franja de íconos al pie del 3D: por defecto, los extra cartones a bordo por SKU
// (EXTRAS_QTY) bajo el título "Extras a bordo" y fondo blanco. Si hay una caja tocada
// (selectedCrateName), esos mismos íconos pasan a mostrar el contenido de ESA caja bajo
// "En esta caja", con el fondo teñido según su SKU — así no hace falta una franja
// aparte arriba del vehículo solo para mostrar el contenido de una caja tocada.
function renderCrateIconsPanel() {
  const panel = document.getElementById('crate-icons-panel');
  const title = document.getElementById('crate-icons-title');
  const row = document.getElementById('crate-icons-row');
  if (!panel || !title || !row) return;
  const slot = selectedCrateName ? loadSlotForCrateName(selectedCrateName) : null;
  if (slot) {
    title.textContent = 'En esta caja';
    row.innerHTML = slot.mixed
      ? slot.contents.map(c => crateInfoItemHTML(c.sku, c.qty)).join('')
      : crateInfoItemHTML(slot.sku, slot.used);
    panel.style.background = crateIconsTint(CRATE_SKU_COLORS[slot.mixed ? 'mixed' : slot.sku]);
  } else {
    title.textContent = 'Extras a bordo';
    row.innerHTML = ['gsp', 'gcp', 'pcp'].map(sku => crateInfoItemHTML(sku, EXTRAS_QTY[sku] || 0)).join('');
    panel.style.background = '#fff';
  }
}

function resetCrateSku(crateName) {
  const crate = TRUCK_CRATES[crateName];
  if (!crate) return;
  crate.traverse(n => {
    if (n.material && n.__skuColored && n.__origColor) {
      n.material.color.copy(n.__origColor);
    }
  });
}

// Oculta del modelo las cajas que ese día no hace falta cargar (ninguna de las 13 es
// fija del vehículo) — solo se ven las que "Cargar Dino"/Extras realmente asignaron.
function setCrateVisible(crateName, visible) {
  const crate = TRUCK_CRATES[crateName];
  if (crate) crate.visible = visible;
}

// Modo "activo" al tocar una caja — se agrega un brillo (emissive) parejo encima del
// color que ya tenga, para que se note seleccionada sea cual sea su SKU/color.
function setCrateHighlight(crateObj, on) {
  if (!crateObj) return;
  crateObj.traverse(n => {
    if (!n.material) return;
    if (!n.__skuColored) { // primer toque antes de "Cargar Dino" — clonar para no afectar otras cajas que compartan el material de Fusion
      n.material = n.material.clone();
      n.__origColor = n.material.color.clone();
      n.__skuColored = true;
    }
    if (!n.material.emissive) return;
    if (on) {
      if (!n.__baseEmissive) n.__baseEmissive = n.material.emissive.clone();
      n.material.emissive.setHex(0x666666);
    } else if (n.__baseEmissive) {
      n.material.emissive.copy(n.__baseEmissive);
    }
  });
}

const CABIN_SLOT_TO_CRATE = { copilot: 'crate_copilot', backseat_right: 'crate_backseat_right', backseat_left: 'crate_backseat_left' };
function renderLoadColors(load) {
  Object.keys(CABIN_SLOT_TO_CRATE).forEach(slot => {
    const c = load.cabin[slot];
    const name = CABIN_SLOT_TO_CRATE[slot];
    const needed = c.mixed ? c.contents.length > 0 : c.used > 0;
    if (needed) setCrateSku(name, c.mixed ? 'mixed' : c.sku);
    else resetCrateSku(name);
    setCrateVisible(name, needed);
  });
  for (let i = 0; i < 10; i++) {
    const crateNum = i + 1;
    const name = 'crate_bed_' + crateNum;
    const idx = bedLogicalIndexForCrateNum(crateNum, load.bed.length);
    const c = idx === -1 ? undefined : load.bed[idx];
    if (c) setCrateSku(name, c.mixed ? 'mixed' : c.sku);
    else resetCrateSku(name);
    setCrateVisible(name, !!c);
  }
  // Evita mostrar el contenido de una caja ya recalculada (la identidad/posición de las
  // cajas puede cambiar al recalcular) — si había una tocada, se deselecciona.
  if (selectedCrateName) setCrateHighlight(TRUCK_CRATES[selectedCrateName], false);
  selectedCrateName = null;
  renderCrateIconsPanel();
}

// Semana de datos para "Cargar Dino"/Extras/refill: null = semana en vivo (de
// producción). Se usó -1 (semana pasada) temporalmente para probar con volumen real
// mientras la semana en vivo no tenía entregas pendientes — ya vuelto a null para producción.
const TEST_CARGA_WEEK_OFFSET = null;
async function getCargaDinoStops(day) {
  if (TEST_CARGA_WEEK_OFFSET === null) return buildStops(day).filter(s => !s.entregado);
  const weekKey = getWeekDates(TEST_CARGA_WEEK_OFFSET).key;
  const pedidos = await getDashPedidosForWeek(weekKey);
  return buildDashStopsForWeek(day, weekKey, pedidos);
}
// ════════════════════════════════════════════════════════════════════════════════

let CURRENT_LOAD = null; // última asignación calculada — null hasta que se corre "Cargar Dino"

// Carga congelada (cabina + caja de carga, extras ya fundidos adentro) tomada en el
// último "momento de carga" real — Cargar Dino, aplicar Extras, modificar una entrega
// (ver recomputeLoadFresh). Un recálculo disparado por marcar/reversar una entrega NO
// vuelve a decidir dónde va cada cosa (ver computeAndStoreLoad/capLoadToReal) — eso
// inventaría cartones que ya no están, o movería/mezclaría los extras con lo que haya
// cambiado, aunque esos extras sigan físicamente en la misma caja.
let BASE_LOAD = null;
let BASE_LOAD_PERSONAS = null; // cuántas personas había en ruta cuando se congeló BASE_LOAD
function cloneCrate(c) {
  return c.mixed ? { ...c, contents: c.contents.map(x => ({ ...x })) } : { ...c };
}
function cloneFullLoad(load) {
  return {
    cabin: {
      copilot: cloneCrate(load.cabin.copilot),
      backseat_right: cloneCrate(load.cabin.backseat_right),
      backseat_left: cloneCrate(load.cabin.backseat_left),
    },
    bed: load.bed.map(cloneCrate),
    overflow: load.overflow,
    middleCount: load.middleCount,
  };
}

// Topa (nunca mueve de caja, nunca refunde) lo que ya está congelado en BASE_LOAD
// contra la demanda real de HOY (`freshReal`, recalculado de cero sin congelar nada,
// así es como se entera de cuánto bajó o subió) — cada caja se queda en su lugar, con
// su mezcla tal cual estaba; lo único que puede cambiar es cuánto de su parte REAL
// (nunca la parte "extra", marcada con extraUsed/extraQty) sigue ahí. Si la demanda
// real total de un SKU bajó (entregas ya hechas), eso se nota acá; si subió de nuevo
// (se reversó una entrega marcada por error), también puede volver a subir — no es un
// trinquete de un solo sentido.
function capLoadToReal(base, freshReal) {
  const budget = { gcp: 0, gsp: 0, pcp: 0 }; // cuánto necesita HOY cada SKU, de verdad
  allLoadSlots(freshReal).forEach(c => {
    if (c.mixed) c.contents.forEach(ct => { budget[ct.sku] += ct.qty; });
    else if (c.capacity > 0) budget[c.sku] += c.used;
  });
  function capCrate(c) {
    if (c.mixed) {
      const contents = c.contents.map(ct => {
        const extra = ct.extraQty || 0;
        const realPortion = Math.max(0, ct.qty - extra);
        const used = Math.min(realPortion, budget[ct.sku]);
        budget[ct.sku] -= used;
        return { sku: ct.sku, qty: used + extra, extraQty: extra };
      }).filter(ct => ct.qty > 0);
      return { ...c, contents };
    }
    if (c.capacity === 0) return c; // asiento deshabilitado por PERSONAS_EN_RUTA
    const extra = c.extraUsed || 0;
    const realPortion = Math.max(0, c.used - extra);
    const used = Math.min(realPortion, budget[c.sku]);
    budget[c.sku] -= used;
    return { ...c, used: used + extra };
  }
  // Cabina primero (se consume primero en el camino real, ver computeLoadPlan), después
  // la caja de carga en su orden de siempre — define qué caja "pierde" primero cuando
  // la demanda total baja.
  const cabin = {
    copilot: capCrate(base.cabin.copilot),
    backseat_right: capCrate(base.cabin.backseat_right),
    backseat_left: capCrate(base.cabin.backseat_left),
  };
  const bed = base.bed.map(capCrate).filter(c => c.mixed ? c.contents.length > 0 : c.used > 0);
  return { cabin, bed, overflow: false, middleCount: base.middleCount };
}

// Cambia qué asientos existen físicamente como caja (el copiloto deja de ser caja si
// hay alguien sentado ahí) — eso sí tiene que recalcularse de cero, aunque sea un
// recálculo del mismo día, por eso BASE_LOAD se invalida cuando cambia.
async function computeAndStoreLoad() {
  const day = todayDefaultDay();
  const stops = await getCargaDinoStops(day);
  const freshReal = assignLoad(stops);
  if (freshReal.overflow) return freshReal;
  CURRENT_LOAD = (BASE_LOAD && BASE_LOAD_PERSONAS === PERSONAS_EN_RUTA)
    ? capLoadToReal(BASE_LOAD, freshReal)
    : freshReal;
  return CURRENT_LOAD;
}

function cargarDinoKeyToday() { return new Date().toISOString().slice(0, 10); }
function extrasAlreadyUsedToday() {
  try { return localStorage.getItem('huevoruta_cargardino_day') === cargarDinoKeyToday(); }
  catch (e) { return false; }
}
function setExtrasEnabled(enabled) {
  const btn = document.getElementById('extras-btn');
  if (btn) btn.disabled = !enabled;
}
function markCargarDinoUsedToday() {
  try { localStorage.setItem('huevoruta_cargardino_day', cargarDinoKeyToday()); } catch (e) {}
  setExtrasEnabled(true);
}

// "¿Personas en ruta?" — se pregunta cada vez que se toca "Cargar Dino" porque puede
// cambiar viaje a viaje. Define cuánto lugar de cabina queda libre para cajas (ver
// cabinCapsForPersonas) — el cupo de G-CP "accesible" (1 caja de 10) nunca desaparece,
// se corre de asiento (copiloto si va solo el repartidor, asiento trasero izquierdo si
// no) en vez de perderse; el de P-CP sí se achica con cada persona de más.
let PERSONAS_EN_RUTA = 1;
let personasDraft = 1;
function cabinCapsForPersonas(n) {
  const copilotCap = CRATE_CARTONES;
  const pcpCap = n >= 3 ? 0 : (n === 2 ? CRATE_CARTONES * 2 : CRATE_CARTONES * 2 * 2);
  return { copilotCap, pcpCap };
}
function openPersonasOverlay() {
  if (!TRUCK_CRATES.crate_bed_1) { toast('⚠️ El modelo 3D todavía está cargando'); return; }
  personasDraft = PERSONAS_EN_RUTA;
  updatePersonasDisplay();
  const closeBtn = document.getElementById('personas-close-btn');
  if (closeBtn && !closeBtn.innerHTML) closeBtn.innerHTML = iconCancel(40);
  document.getElementById('personas-overlay').classList.add('show');
}
function closePersonasOverlay() { document.getElementById('personas-overlay').classList.remove('show'); }
function updatePersonasDisplay() { document.getElementById('personas-count-display').textContent = personasDraft; }
function changePersonasDraft(delta) {
  personasDraft = Math.max(1, Math.min(3, personasDraft + delta));
  updatePersonasDisplay();
}
async function confirmPersonasAndLoad() {
  PERSONAS_EN_RUTA = personasDraft;
  closePersonasOverlay();
  await cargarDinoProceed();
}

// "Cargar Dino" — calcula el mejor orden de carga de las 13 cajas para lo que queda
// del día (las entregas ya hechas no cuentan).
async function cargarDinoProceed() {
  if (!TRUCK_CRATES.crate_bed_1) { toast('⚠️ El modelo 3D todavía está cargando'); return; }

  // Reaplica los extras vigentes (EXTRAS_QTY) sobre la base recién calculada — si no,
  // volver a tocar "Cargar Dino" el mismo día pisaba los extras ya cargados y sin
  // entregar con una carga en blanco.
  const { load, overflow, capacityOverflow } = await recomputeLoadFresh();
  if (overflow) {
    toast('⚠️ Hoy hace falta refill — fijá el punto con "Setear refill" antes de cargar');
    return;
  }

  markCargarDinoUsedToday();
  const mixedCount = allLoadSlots(load).filter(c => c.mixed).length;
  stickyBanner(`✅ Orden de carga calculado — ${load.bed.length} caja${load.bed.length === 1 ? '' : 's'} en el cajón` +
    (mixedCount ? ` (${mixedCount} mixta${mixedCount === 1 ? '' : 's'})` : '') +
    (load.middleCount ? ` — quedan ${load.middleCount} caja${load.middleCount === 1 ? '' : 's'} para traer en el refill` : ''));
  if (capacityOverflow) showCapacidadExcedida();
  // La capacidad del vehículo (para el aviso de "hace falta refill") depende de
  // PERSONAS_EN_RUTA — si cambió, el dashboard tiene que enterarse ahora, no recién en
  // el próximo refresh de fondo.
  renderDashboard();
}

// "Extras" — cartones sueltos que se suben además de lo ya calculado: al momento de
// cargarlos (ver recomputeLoadFresh), primero rellenan una caja existente con lugar de
// su misma SKU (cabina incluida), después cualquier otra caja compatible (nunca mezcla
// con plástico con sin plástico), y recién si no entra en ninguna abre una caja nueva —
// misma prioridad de siempre. Cada cartón que entra así se marca como "extra"
// (extraUsed/extraQty) para que capLoadToReal() sepa qué parte de esa caja no hay que
// tocar nunca en un recálculo disparado por marcar/reversar una entrega.
function mergeExtrasIntoLoad(load, extrasQty) {
  let capacityOverflow = false;
  ['gcp', 'gsp', 'pcp'].forEach(sku => {
    let remaining = extrasQty[sku] || 0;
    if (remaining <= 0) return;
    const slots = allLoadSlots(load);
    for (const c of slots) {
      if (remaining <= 0) break;
      if (!c.mixed && c.sku === sku && c.used < c.capacity) {
        const take = Math.min(remaining, c.capacity - c.used);
        c.used += take; c.extraUsed = (c.extraUsed || 0) + take;
        remaining -= take;
      }
    }
    for (const c of slots) {
      if (remaining <= 0) break;
      if (!c.mixed && c.sku === sku) continue; // mismo sku: ya cubierto en el paso anterior
      const room = remainingEquiv(c);
      if (room <= 0) continue;
      if (c.mixed) { if (hasPlastic(c.contents[0].sku) !== hasPlastic(sku)) continue; }
      else if (hasPlastic(c.sku) !== hasPlastic(sku)) continue;
      const takeEquiv = Math.min(equivOf(sku, remaining), room);
      const takeQty = sku === 'pcp' ? takeEquiv / 0.5 : takeEquiv;
      if (takeQty <= 0) continue;
      if (c.mixed) {
        const existing = c.contents.find(ct => ct.sku === sku);
        if (existing) { existing.qty += takeQty; existing.extraQty = (existing.extraQty || 0) + takeQty; }
        else c.contents.push({ sku, qty: takeQty, extraQty: takeQty });
      } else {
        const prevSku = c.sku, prevQty = c.used, prevExtra = c.extraUsed || 0;
        c.mixed = true;
        c.contents = [{ sku: prevSku, qty: prevQty, extraQty: prevExtra }, { sku, qty: takeQty, extraQty: takeQty }];
        delete c.sku; delete c.used; delete c.extraUsed;
        c.capacity = CRATE_CARTONES;
      }
      remaining -= takeQty;
    }
    while (remaining > 0) {
      if ((3 + load.bed.length) >= 13) { capacityOverflow = true; break; }
      const capacity = capacityOf(sku);
      const used = Math.min(remaining, capacity);
      load.bed.push({ slot: 'bed_' + (load.bed.length + 1), sku, used, extraUsed: used, capacity });
      remaining -= used;
    }
  });
  return capacityOverflow;
}

// Los 3 valores van siempre por SKU como el TOTAL vigente, no como "lo que se agrega
// esta vez" — si se vuelve a abrir "Extras" más tarde en el día, cambiar un número
// reemplaza el anterior (se recalcula la base y se vuelve a aplicar desde cero), no
// se suma encima.
let EXTRAS_QTY = { gcp: 0, gsp: 0, pcp: 0 };

async function openExtrasOverlay() {
  if (!CURRENT_LOAD) {
    toast('Calculando la carga de nuevo…');
    const load = await computeAndStoreLoad();
    if (load.overflow) { toast('⚠️ Hoy hace falta refill — no se puede agregar extras'); return; }
    renderLoadColors(load);
  }
  ['gcp', 'gsp', 'pcp'].forEach(k => { document.getElementById('extras-' + k).value = EXTRAS_QTY[k]; });
  const closeBtn = document.getElementById('extras-close-btn');
  if (closeBtn && !closeBtn.innerHTML) closeBtn.innerHTML = iconCancel(40);
  document.getElementById('extras-overlay').classList.add('show');
}
function closeExtrasOverlay() { document.getElementById('extras-overlay').classList.remove('show'); }

// "Momento de carga" real: recalcula TODO de cero (sin congelar nada) y funde los
// extras vigentes adentro — acá sí conviene rellenar una caja existente con lugar en
// vez de abrir una nueva. El resultado queda congelado en BASE_LOAD hasta el próximo
// momento de carga (otro "Cargar Dino", otro cambio en Extras, un pedido modificado).
// Usado al tocar "Cargar Dino", al confirmar el overlay de Extras, y cuando un pedido
// cambia (modificar entrega / entrega flash) — nunca cuando solo se marca o reversa una
// entrega (eso usa computeAndStoreLoad(), que topa sin reacomodar nada, ver arriba).
async function recomputeLoadFresh() {
  const day = todayDefaultDay();
  const stops = await getCargaDinoStops(day);
  const load = assignLoad(stops);
  if (load.overflow) return { load, overflow: true, capacityOverflow: false };
  const capacityOverflow = mergeExtrasIntoLoad(load, EXTRAS_QTY);
  BASE_LOAD = cloneFullLoad(load);
  BASE_LOAD_PERSONAS = PERSONAS_EN_RUTA;
  CURRENT_LOAD = load;
  renderLoadColors(load);
  return { load, overflow: false, capacityOverflow };
}

async function applyExtras() {
  EXTRAS_QTY = {
    gcp: parseInt(document.getElementById('extras-gcp').value, 10) || 0,
    gsp: parseInt(document.getElementById('extras-gsp').value, 10) || 0,
    pcp: parseInt(document.getElementById('extras-pcp').value, 10) || 0,
  };
  closeExtrasOverlay();
  const { overflow, capacityOverflow } = await recomputeLoadFresh();
  if (overflow) { toast('⚠️ Hoy hace falta refill — no se puede agregar extras'); return; }
  if (capacityOverflow) showCapacidadExcedida();
  else toast('✅ Extras agregados');
}

// contando como originado por el usuario y no lo bloquea el popup blocker de Safari.
// Tocar un "próximo" que NO está seleccionado lo selecciona. Tocar el que YA está
// seleccionado abre Waze hacia ese cliente — el long-press resultó poco confiable en iOS,

  document.querySelectorAll('.next-row').forEach(row => {

}

async function saveModificarEntrega() {
  const stop = STOPS_BY_ID[modifyOverlayClienteId]; if (!stop) return;
  const c = stop.cliente;
  const gcp = parseInt(document.getElementById('modify-gcp').value, 10) || 0;
  const gsp = parseInt(document.getElementById('modify-gsp').value, 10) || 0;
  const pcp = parseInt(document.getElementById('modify-pcp').value, 10) || 0;
  const key = `${wk.key}_${c.id}`;
  const conf = CONFIRMACIONES[key];
  if (!conf) { toast('⚠️ No se encontró la confirmación de este cliente'); return; }
  // Si el pedido sube, lo que sube sale de los extras ya cargados (hay menos remanente
  // disponible); si baja, se libera ese lugar de vuelta a los extras — mismo sentido que
  // una entrega flash consumiendo de EXTRAS_QTY, pero acá puede ir en cualquier dirección.
  const before = deductionFromParts(stop.parts);
  conf.fmtOverride = { ...(conf.fmtOverride || {}), fmt_gcp: gcp, fmt_gsp: gsp, fmt_pcp: pcp };
  const after = { gcp, gsp, pcp };
  ['gcp', 'gsp', 'pcp'].forEach(sku => {
    EXTRAS_QTY[sku] = Math.max(0, EXTRAS_QTY[sku] - (after[sku] - before[sku]));
  });
  try {
    await sbUpsert('kv_store', { key: 'CONFIRMACIONES', value: JSON.stringify(CONFIRMACIONES) });
    closeModifyOverlay();
    toast('✅ Entrega modificada');
    // El plan de carga original ya no refleja lo que este cliente va a llevar — se
    // recalcula desde cero (cabina incluida) ahora mismo, no recién en el próximo
    // "Cargar Dino".
    BASE_LOAD = null;
    if (CURRENT_LOAD) await recomputeLoadFresh();
    render();
    if (document.getElementById('route-overlay').classList.contains('show')) renderRouteOverlay();
  } catch (e) {
    console.error(e);
    toast('⚠️ No se pudo guardar el cambio');
  }
}

// ═══════════════════════════════════════════════
// Entrega flash — replica el núcleo de guardarEntregaRapida() del CRM original:
// mismo rango de ID sintético para el pedido, mismo namespace separado ('inv_'+erKey)
// para la deducción de inventario, para que nunca choque ni se vuelva a deducir sola.
// A diferencia del original, acá no hay buscador de cliente existente (una entrega
// flash es, por definición, alguien fuera de la ruta confirmada) ni edición de precio.
// ═══════════════════════════════════════════════
let flashT30 = 'gcp';
// true (encendido) = con plástico, false = sin plástico — son los únicos 2 buckets de
// inventario reales para el cartón grande (G-CP/G-SP), así que no hace falta más que esto.
function setFlashT30(t) {
  flashT30 = t;
  document.getElementById('flash-t30-toggle').checked = (t === 'gcp');
  document.getElementById('flash-t30-label').textContent = t === 'gcp' ? 'Con plástico' : 'Sin plástico';
}
function onFlashT30Toggle(isOn) { setFlashT30(isOn ? 'gcp' : 'gsp'); }
// Buscador de cliente existente (igual que renderEntregaClienteSearch/selectEntregaCliente
// del CRM original): una entrega flash también puede ser para alguien que YA es cliente
// (un extra puntual fuera de lo ya confirmado), no solo gente nueva. Si se elige uno de la
// lista, se autocompleta su teléfono/zona/formato y se destilda "agregar como cliente" para
// no crear un duplicado de alguien que ya existe en la base.
function renderFlashClienteSearch(q) {
  const container = document.getElementById('flash-cli-results');
  const query = (q || '').trim().toLowerCase();
  if (!query) { container.innerHTML = ''; return; }
  const matches = CLIENTES.filter(c => c.estado === 'activo' && c.nombre.toLowerCase().includes(query)).slice(0, 5);
  if (!matches.length) { container.innerHTML = ''; return; }
  container.innerHTML = matches.map(c => {
    const fmtLabel = (c.fmt || []).map(f => `${f.q}×${f.u}u`).join(' + ');
    return `<div class="flash-search-row" onclick="selectFlashCliente(${c.id})"><b>${c.nombre}</b><span class="zona">${c.zona || ''} · ${fmtLabel}</span></div>`;
  }).join('');
}
function selectFlashCliente(id) {
  const c = CLIENTES.find(x => x.id === id);

  document.getElementById('flash-tel').value = c.tel || '';
  document.getElementById('flash-zona').value = c.zona || '';
  document.getElementById('flash-notas').value = c.notas || '';

  const f15 = (c.fmt || []).find(f => f.u === 15);

  document.getElementById('flash-q15').value = f15 ? f15.q : 0;

async function saveFlashDelivery() {
  const nombre = document.getElementById('flash-nombre').value.trim();
  if (!nombre) { toast('⚠️ El nombre es obligatorio'); return; }
  const tel = document.getElementById('flash-tel').value.trim();
  const zona = document.getElementById('flash-zona').value.trim();
  const notas = document.getElementById('flash-notas').value.trim();
  const q30 = parseInt(document.getElementById('flash-q30').value) || 0;
  const q15 = parseInt(document.getElementById('flash-q15').value) || 0;
  const addToClientes = document.getElementById('flash-add-crm').checked;
  if (!q30 && !q15) { toast('⚠️ Indicá al menos una cantidad'); return; }

  // La entrega flash sale SIEMPRE de los extras ya cargados (EXTRAS_QTY), nunca de la
  // demanda real de otros clientes — si pide más de lo que hay cargado de algún SKU,
  // se bloquea antes de escribir nada (ni pedido, ni inventario, ni EXTRAS_QTY).
  const gspWant = flashT30 === 'gsp' ? q30 : 0;
  const gcpWant = flashT30 === 'gcp' ? q30 : 0;
  const pcpWant = q15;
  if (gspWant > EXTRAS_QTY.gsp || gcpWant > EXTRAS_QTY.gcp || pcpWant > EXTRAS_QTY.pcp) {
    showBlockingBanner('⚠️ No hay suficientes cartones extra cargados para esta entrega flash');
    return;
  }

  const p30 = 5000, p15 = 3000;
  const fmt = [];
  if (q30 > 0) fmt.push({ u: 30, q: q30, p: p30 });
  if (q15 > 0) fmt.push({ u: 15, q: q15, p: p15 });

  const ts = Date.now();
  const erId = 800000000 + (ts % 99999999);
  const erKey = 'er_' + ts;
  // El modelo original no tiene un campo de empaque independiente: G-SP va atado al
  // segmento b2b y G-CP al segmento domicilio (ver productBreakdown/buildQuickStops).
  const seg = flashT30 === 'gsp' ? 'b2b' : 'domicilio';

  const pedido = {
    id: erId, week_key: wk.key, week_label: wk.label,
    nombre, ruta: selectedDay, zona, notas, tel,
    fmt, seg, pago: 'pendiente',
    entregado: true, nota_cobro: '', agregado_manual: true,
    es_entrega_rapida: true, auto_key: erKey
  };

  try {
    await sbUpsert('pedidos', pedido);

    const kv = await sbGet('kv_store', 'key=eq.inventario&select=value');
    let inv = [];
    try { inv = JSON.parse((kv[0] && kv[0].value) || '[]'); } catch (e) { inv = []; }
    const gsp = gspWant, gcp = gcpWant, pcp = pcpWant;
    inv.push({
      id: Date.now(),
      fecha: new Date().toISOString().split('T')[0],
      tipo: 'entrega', desc: 'Entrega extra: ' + nombre, notas: 'Entrega flash (huevoruta)',
      gsp: -gsp, gcp: -gcp, pcp: -pcp,
      total: -(gsp + gcp + pcp * 0.5),
      autoKey: 'inv_' + erKey
    });
    await sbUpsert('kv_store', { key: 'inventario', value: JSON.stringify(inv) });

    // Si ya se estaban cargando extras ese día (EXTRAS_QTY), esta entrega sale de ahí
    // antes que de cualquier otro lado — el remanente de extras baja, no se suma aparte.
    EXTRAS_QTY.gsp = Math.max(0, EXTRAS_QTY.gsp - gsp);
    EXTRAS_QTY.gcp = Math.max(0, EXTRAS_QTY.gcp - gcp);
    EXTRAS_QTY.pcp = Math.max(0, EXTRAS_QTY.pcp - pcp);
    if (CURRENT_LOAD) await recomputeLoadFresh();

    if (addToClientes) {
      // Rango propio (900000000+) para que un cliente nuevo creado desde acá nunca
      // choque con un id real (los clientes reales son enteros chicos, secuenciales).
      const newClienteId = 900000000 + (ts % 99999999);
      await sbUpsert('clientes', {
        id: newClienteId, nombre, tel, zona, notas,
        seg, ruta: selectedDay, fmt,
        estado: 'activo', freq: 'semanal'
      });
    }

    PEDIDOS.push(pedido);
    // Misma marca de tiempo que las entregas normales (ver setEntregado) — así
    // "Entregados" las puede ordenar juntas por orden real de entrega.
    ENTREGA_TS[`${wk.key}_${erId}`] = ts;
    sbUpsert('kv_store', { key: 'entrega_ts', value: JSON.stringify(ENTREGA_TS) }).catch(e => console.error(e));
    closeFlashOverlay();
    toast('⚡ Entrega flash registrada');
    render();
    if (document.getElementById('route-overlay').classList.contains('show')) renderRouteOverlay();
  } catch (e) {
    console.error(e);
    toast('⚠️ No se pudo guardar la entrega flash');
  }
}

// Reversar una entrega flash: se anula (auto_key pasa a empezar con "vr_", lo que la
// saca de buildQuickStops para siempre — el registro queda en pedidos por las dudas,
// no se borra) y se devuelve todo lo que consumió: el inventario vuelve a subir, y lo
// que había salido de los extras cargados (EXTRAS_QTY) vuelve a estar disponible.
async function reverseFlashDelivery(id) {
  const pedido = PEDIDOS.find(p => p.id === id && p.es_entrega_rapida);
  if (!pedido) return;
  const quick = buildQuickStops(selectedDay).find(q => q.pedido.id === id);
  if (!quick) return;
  const { gsp, gcp, pcp } = deductionFromParts(quick.parts);
  try {
    const voidedKey = 'vr_' + pedido.auto_key;
    await sbUpsert('pedidos', { ...pedido, auto_key: voidedKey });

    const kv = await sbGet('kv_store', 'key=eq.inventario&select=value');
    let inv = [];
    try { inv = JSON.parse((kv[0] && kv[0].value) || '[]'); } catch (e) { inv = []; }
    const filtered = inv.filter(i => i.autoKey !== 'inv_' + pedido.auto_key);
    if (filtered.length !== inv.length) {
      await sbUpsert('kv_store', { key: 'inventario', value: JSON.stringify(filtered) });
    }

    EXTRAS_QTY.gsp += gsp;
    EXTRAS_QTY.gcp += gcp;
    EXTRAS_QTY.pcp += pcp;
    if (CURRENT_LOAD) await recomputeLoadFresh();

    const idx = PEDIDOS.findIndex(p => p.id === id);
    if (idx >= 0) PEDIDOS[idx] = { ...PEDIDOS[idx], auto_key: voidedKey };
    delete ENTREGA_TS[`${wk.key}_${id}`];
    sbUpsert('kv_store', { key: 'entrega_ts', value: JSON.stringify(ENTREGA_TS) }).catch(e => console.error(e));

    toast('↩ Entrega flash reversada');
    render();
    if (document.getElementById('route-overlay').classList.contains('show')) renderRouteOverlay();
  } catch (e) {
    console.error(e);
    toast('⚠️ No se pudo revertir la entrega flash');
  }
}

// ═══════════════════════════════════════════════
// Route overlay (full day, drag-reorder, pendientes/entregados)
// ═══════════════════════════════════════════════
function openRouteOverlay() {
  routeSelectedKey = null;
  renderRouteOverlay();
  document.getElementById('route-overlay').classList.add('show');
}
function closeRouteOverlay() { document.getElementById('route-overlay').classList.remove('show'); }

function setRouteFilter(f) { routeFilter = f; routeSelectedKey = null; renderRouteOverlay(); }

function renderRouteOverlay() {
  initRouteHeaderIcons();
  document.getElementById('route-pills').innerHTML = ['lunes', 'martes', 'miercoles', 'pickup'].map(d =>
    `<button class="day-chip ${d === selectedDay ? 'active' : ''}" onclick="changeDay('${d}')">${DAY_LABEL[d]}</button>`
  ).join('');

  const stops = buildStops(selectedDay);
  const quick = buildQuickStops(selectedDay);
  // El número mostrado es la posición absoluta dentro del día completo (igual que el
  // contador de la tarjeta principal), no la posición dentro de esta sublista filtrada —
  // si no, al entregarle al #1 la lista de pendientes "reiniciaba" y volvía a empezar en 1.
  let html;
  if (routeFilter === 'pendientes') {
    html = stops.filter(s => !s.entregado)
      .map(s => paradaRow(s, stops.findIndex(x => x.cliente.id === s.cliente.id), true)).join('');
  } else {
    // "Entregados" mezcla paradas normales y entregas flash en una sola lista, ordenada
    // por orden real de entrega (más reciente primero) — una entrega flash recién
    // registrada aparece arriba de todo, no siempre al final. Los sin marca de tiempo
    // (entregados antes de este cambio) quedan al final.
    const combined = stops.filter(s => s.entregado).map(s => ({
      ts: getEntregaTs(s.cliente.id),
      html: paradaRow(s, stops.findIndex(x => x.cliente.id === s.cliente.id), false),
    })).concat(quick.map(q => ({ ts: getEntregaTs(q.pedido.id), html: quickParadaRow(q) })));
    combined.sort((a, b) => b.ts - a.ts);
    html = combined.map(x => x.html).join('');
  }
  if (!html) html = `<div class="empty-state" style="color:rgba(255,255,255,0.5)">${routeFilter === 'pendientes' ? 'No quedan paradas pendientes.' : 'Nada entregado todavía.'}</div>`;

  document.getElementById('route-list-body').innerHTML = html;
  document.querySelectorAll('.filter-switch button').forEach(b => b.classList.toggle('active', b.dataset.filter === routeFilter));
  if (routeFilter === 'pendientes') initRouteDragDrop();
  updateRouteChatBtn();
}

// Selección dentro de la lista completa de ruta (independiente de activeStopId, que es
// del card principal): 1 tap selecciona/deselecciona una fila, y habilita el botón
// flotante de WhatsApp para esa fila. Entregas flash no tienen id de cliente, así que
// la key lleva un prefijo ('c:' cliente normal, 'q:' entrega flash) para no confundirlas.
function selectRouteStop(key) {
  routeSelectedKey = (routeSelectedKey === key) ? null : key;
  renderRouteOverlay();
}
function routeSelectedContact() {
  if (!routeSelectedKey) return null;
  const sep = routeSelectedKey.indexOf(':');
  const kind = routeSelectedKey.slice(0, sep);
  const id = parseInt(routeSelectedKey.slice(sep + 1), 10);
  if (kind === 'c') { const s = STOPS_BY_ID[id]; return s ? s.cliente : null; }
  if (kind === 'q') return buildQuickStops(selectedDay).find(q => q.pedido.id === id) || null;
  return null;
}
function updateRouteChatBtn() {
  const btn = document.getElementById('route-chat-btn');
  if (!btn) return;
  btn.innerHTML = iconMessage(55); // 48 + 15%
  const c = routeSelectedContact();
  btn.disabled = !(c && waUrl(c));
}
// Iconos estáticos del header del overlay de ruta (no cambian con cada render, pero se
// completan acá para mantener su markup en el HTML estático junto al resto del overlay).
function initRouteHeaderIcons() {
  const closeBtn = document.getElementById('route-close-btn');
  if (closeBtn && !closeBtn.innerHTML) closeBtn.innerHTML = iconCancel(40);
}
function openRouteChat() {
  const c = routeSelectedContact();
  const wa = c && waUrl(c);
  if (!wa) return;
  openExternal(wa);
}

// Pequeña identificación de qué formato/SKU pidió cada cliente, para la lista completa.
// El café se marca distinto (no es un formato de huevos) para que salte a la vista.
function skuBadges(parts) {
  if (!parts || !parts.length) return '';
  return `<div class="parada-skus">${parts.map(p => p.k === 'cafe'
    ? `<span class="parada-sku cafe">☕ Café</span>`
    : `<span class="parada-sku"><b>${p.qty}</b> ${PROD_LABEL[p.k] || p.k}</span>`
  ).join('')}</div>`;
}

// Misma nota de confirmación que se muestra en la tarjeta principal (note-pill),
// pero en formato compacto para una fila de la lista completa.
function noteLine(nota) {
  return nota ? `<div class="parada-note"><span class="warn">${iconNoteWarn(20)}</span>${nota}</div>` : '';
}

function paradaRow(s, i, draggable) {
  const c = s.cliente;
  const addr = (c.zona || '') + (c.notas ? ' — ' + c.notas : '');
  const nota = s.conf && s.conf.nota;
  const parts = withCafeIfNoted(s.parts, nota);
  const key = 'c:' + c.id;
  const selected = key === routeSelectedKey ? ' selected' : '';
  if (draggable) {
    return `
    <div class="parada-row${selected}" data-client-id="${c.id}">
      <div class="drag-handle">⠿</div>
      <div class="idx">${i + 1}</div>
      <div class="info" onclick="selectRouteStop('${key}')">
        <div class="name">${c.nombre}</div>
        <div class="addr">${addrLink(c, addr)}</div>
        ${skuBadges(parts)}
        ${noteLine(nota)}
      </div>
    </div>`;
  }
  return `
    <div class="parada-row${selected}">
      <div class="idx">✓</div>
      <div class="info" onclick="selectRouteStop('${key}')"><div class="name">${c.nombre}</div><div class="addr">${addrLink(c, addr)}</div>${skuBadges(parts)}${noteLine(nota)}</div>
      <button class="round-btn dark sm" onclick="setEntregado(STOPS_BY_ID[${c.id}], false)">↩</button>
    </div>`;
}
function quickParadaRow(q) {
  const addr = (q.zona || '') + (q.notas ? ' — ' + q.notas : '');
  const parts = withCafeIfNoted(q.parts, q.notas);
  const key = 'q:' + q.pedido.id;
  const selected = key === routeSelectedKey ? ' selected' : '';
  return `
    <div class="parada-row${selected}">
      <div class="idx">⚡</div>
      <div class="info" onclick="selectRouteStop('${key}')"><div class="name">${q.nombre}</div><div class="addr">${addrLink(q, addr)}</div>${skuBadges(parts)}</div>
      <button class="round-btn dark sm" onclick="reverseFlashDelivery(${q.pedido.id})">↩</button>
    </div>`;
}

// Pointer Events (no HTML5 drag-and-drop): el DnD nativo no dispara en touch
// (iOS/Android), solo con mouse — mismo tipo de limitación de gestos táctiles ya
// encontrada con el long-press. Arrastre real desde .drag-handle, con
// setPointerCapture para que el drag siga funcionando aunque el dedo se mueva
// sobre otras filas, y reordenando el DOM en vivo según la posición del dedo.
function initRouteDragDrop() {
  const container = document.getElementById('route-list-body');
  const getRows = () => [...container.querySelectorAll('.parada-row[data-client-id]')];
  let dragRow = null;

  container.querySelectorAll('.parada-row[data-client-id] .drag-handle').forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      dragRow = handle.closest('.parada-row');
      dragRow.classList.add('parada-dragging');
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', e => {
      if (!dragRow) return;
      e.preventDefault();
      const y = e.clientY;
      const rows = getRows();
      const after = rows.find(r => r !== dragRow && y < r.getBoundingClientRect().top + r.getBoundingClientRect().height / 2);
      if (after) {
        if (after.previousElementSibling !== dragRow) container.insertBefore(dragRow, after);
      } else if (rows[rows.length - 1] !== dragRow) {
        container.appendChild(dragRow);
      }
    });
    const endDrag = e => {
      if (!dragRow) return;
      dragRow.classList.remove('parada-dragging');
      const newOrder = getRows().map(r => parseInt(r.dataset.clientId));
      dragRow = null;
      persistNewOrder(newOrder);
    };
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  });
}

function persistNewOrder(newPendingOrder) {
  const stops = buildStops(selectedDay);
  const doneIds = stops.filter(s => s.entregado).map(s => s.cliente.id);
  const key = `ruta_order_${wk.key}_${selectedDay}`;
  RUTA_ORDERS[key] = [...newPendingOrder, ...doneIds];
  sbUpsert('kv_store', { key: 'ruta_orders', value: JSON.stringify(RUTA_ORDERS) }).catch(e => console.error(e));
  render();
  renderRouteOverlay();
}

// ═══════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════
// Corrige el 100dvh "viejo" de iOS Safari (ver el comentario en html,body del <style>):
// recalcula --app-height a mano ante cualquier evento que pueda delatar que el dvh del
// navegador quedó desactualizado — volver de segundo plano, desbloquear la pantalla,
// rotar, o el propio resize del visualViewport (que en iOS SÍ se dispara siempre,
// aunque el dvh de CSS se haya quedado pegado).
function setAppHeight() {
  const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  document.documentElement.style.setProperty('--app-height', h + 'px');
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', setAppHeight);
window.addEventListener('pageshow', setAppHeight);
document.addEventListener('visibilitychange', () => { if (!document.hidden) setAppHeight(); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', setAppHeight);
}

initPager();
initCubeSheet();
initCubeSwipeClose();
initCubeRotate();
setExtrasEnabled(extrasAlreadyUsedToday());
loadAll();
setInterval(loadAll, 25000); // mismo espíritu que el auto-sync de 30s del CRM original
</script>
